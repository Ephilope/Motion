<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les 9 signes</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { height: 100vh; width: 56.25vh; max-width: 100vw; max-height: 177.78vw; display: block; }

  #ui { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center;
        background: rgba(5, 7, 15, .75); padding: 8px 14px; border-radius: 999px; font: 14px Inter, sans-serif; color: #fff; }
  #ui button { background: #f5c04a; border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; cursor: pointer; }

</style>
</head>
<body>
<div id="wrap"><svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="ui"><button id="play">Pause</button><input id="seek" type="range" min="0" max="88" step="0.01" value="0"><span id="time">0.0s</span></div>
<script>
// ---------------------------------------------------------------------------
// Moteur : l'image est une fonction pure du temps -> renderAt(t)
// ---------------------------------------------------------------------------
const NS = 'http://www.w3.org/2000/svg';
const W = 1080, H = 1920, DUR = 88;
const svg = document.getElementById('stage');
const RENDER = new URLSearchParams(location.search).has('render');

function el(tag, attrs = {}, parent) {

  for (const k in attrs) e.setAttribute(k, attrs[k]);

}
function set(e, attrs) { for (const k in attrs) e.setAttribute(k, attrs[k]); }
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  lin: t => t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  out5: t => 1 - Math.pow(1 - t, 5),
  in: t => t * t * t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },

const p = (t, a, b, ease = E.inOut) => ease(clamp((t - a) / (b - a)));
const rad = d => d * Math.PI / 180;
const fmt = n => (+n).toFixed(1);
function rng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

}
function rot(pt, c, deg) {
  const a = rad(deg), dx = pt[0] - c[0], dy = pt[1] - c[1];
  return [c[0] + dx * Math.cos(a) - dy * Math.sin(a), c[1] + dx * Math.sin(a) + dy * Math.cos(a)];
}
function smoothClosed(pts) {
  const n = pts.length; let d = `M${fmt(pts[0][0])},${fmt(pts[0][1])}`;
  for (let i = 0; i < n; i++) {

}

// ---------------------------------------------------------------------------
// Dégradés, motifs
// ---------------------------------------------------------------------------
const defs = el('defs', {}, svg);
function lg(id, stops, x2 = 0, y2 = 1) { const g = el('linearGradient', { id, x1: 0, y1: 0, x2, y2 }, defs); stops.forEach(([o, c, op = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': op }, g)); }

rg('gBg', [[0, '#1b2546'], [1, '#04060d']], .5, .4, .9);
lg('gMetal', [[0, '#ffffff'], [.42, '#cfd8e6'], [.5, '#5a687e'], [.6, '#9eabbf'], [1, '#eef3fa']]);
lg('gGold', [[0, '#fff4c8'], [.42, '#f5c04a'], [.5, '#8f6210'], [.62, '#e3aa3a'], [1, '#ffe9a6']]);
lg('gRedMetal', [[0, '#ff8a8a'], [.45, '#e23636'], [.52, '#7a0f0f'], [.65, '#c92a2a'], [1, '#ff6b6b']]);
lg('gShine', [[0, '#ffffff', 0], [.5, '#ffffff', .95], [1, '#ffffff', 0]], 1, 0);
rg('gFlare', [[0, '#ffffff', 1], [.25, '#bfe9ff', .7], [1, '#4fc3ff', 0]]);
rg('gCore', [[0, '#ffffff'], [.35, '#9be8ff', .9], [1, '#4fc3ff', 0]]);
rg('gVig', [[.45, '#000', 0], [1, '#000', .85]]);
rg('gEmber', [[0, '#fff1c1'], [.4, '#ffb347', .9], [1, '#ff6a00', 0]]);
rg('gSunrise', [[0, '#ffd56b', .95], [.35, '#ff9a3d', .55], [1, '#1b2546', 0]], .5, .95, .9);
rg('gSmoke', [[0, '#05060b', .95], [.6, '#0b0d18', .7], [1, '#0b0d18', 0]]);
lg('gNight', [[0, '#0a1230'], [1, '#26345e']]);
lg('gPaper', [[0, '#f6efdc'], [1, '#e9dfc4']]);

el('circle', { cx: 9, cy: 9, r: 3.4, fill: '#fff' }, ht);
const htD = el('pattern', { id: 'htD', width: 14, height: 14, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(20)' }, defs);
el('circle', { cx: 7, cy: 7, r: 3, fill: '#000' }, htD);
const ACC = ['#3d6bff', '#8a90a6', '#ff9f43', '#6c5ce7', '#00c2a8', '#ffcc00', '#e84393', '#00a8ff', '#5b4a9e'];
ACC.forEach((c, i) => { rg('gAcc' + i, [[0, c, .55], [1, c, 0]]); lg('gPan' + i, [[0, mix(c, '#05070f', .55)], [1, mix(c, '#05070f', .85)]]); });

// ---------------------------------------------------------------------------
// Textes
// ---------------------------------------------------------------------------
let uid = 0;
function metalText(parent, str, o) {

  const depth = o.depth ?? Math.max(2, Math.round(o.size / 22));
  for (let d = depth; d >= 1; d--) { const s = el('text', { ...base, y: base.y + d * 1.4, fill: d === depth ? '#000' : '#232a3b' }, g); s.textContent = str; }
  const main = el('text', { ...base, fill: `url(#${o.grad || 'gMetal'})`, stroke: '#fff', 'stroke-opacity': .4, 'stroke-width': Math.max(1, o.size / 90) }, g);
  main.textContent = str;
  const w = main.getComputedTextLength();
  const id = 'mt' + (uid++); const cp = el('clipPath', { id }, defs); el('text', base, cp).textContent = str;
  const shine = el('rect', { x: 0, y: 0, width: o.size * .9, height: o.size * 1.4, fill: 'url(#gShine)' }, el('g', { 'clip-path': `url(#${id})` }, g));

    g, w,
    shine(u) { set(shine, { transform: `translate(${fmt(x0 - o.size * 1.6 + u * (w + o.size * 3.2))},${fmt(base.y - o.size * 1.1)}) skewX(-22)` }); },

}
function wrapLines(str, size, maxW, weight = 600) {
  const probe = el('text', { 'font-size': size, 'font-weight': weight }, svg);
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    probe.textContent = test.replace(/\*/g, '');
    if (probe.getComputedTextLength() > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }

}
function richText(parent, line, attrs, hi = '#f5c04a') {
  const t = el('text', attrs, parent);
  line.split(/(\*[^*]+\*)/).filter(Boolean).forEach(seg => {
    const s = el('tspan', seg.startsWith('*') ? { fill: hi } : {}, t); s.textContent = seg.replace(/\*/g, '');
  });

}
function pill(parent, str, o = {}) {

  const size = o.size || 32;
  const bg = el('rect', { rx: o.rx ?? size * .5, fill: o.bg || '#e23636' }, inner);
  const tx = el('text', { 'text-anchor': 'middle', 'font-size': size, 'font-weight': 900, fill: o.color || '#fff', y: size * .36, 'letter-spacing': o.ls ?? 2 }, inner);

// ---------------------------------------------------------------------------
// Le héros (et ses allié·es) — vue de face, membres en cinématique inverse
// ---------------------------------------------------------------------------
function ik(R, T, l1, l2, side) {

  const k2 = [R[0] + l1 * Math.cos(base - a), R[1] + l1 * Math.sin(base - a)];
  const K = (side > 0 ? k1[0] > k2[0] : k1[0] < k2[0]) ? k1 : k2;
  const Tf = [R[0] + d * Math.cos(base), R[1] + d * Math.sin(base)];

    boots: '#121933', glove: '#c62828', pants: null, mask: true, hasCape: true, coat: false, hero: true, hairStyle: 'short' }, opt);

  const torso = el('g', {}, body);

  if (c.coat) {
    el('path', { d: 'M-78,-336 L-70,-120 L-14,-120 L0,-290 L14,-120 L70,-120 L78,-336 Q0,-350 -78,-336Z', fill: '#f4f7fb', stroke: '#d5dce8', 'stroke-width': 4, 'stroke-linejoin': 'round' }, torso);
    el('path', { d: 'M-34,-340 C-46,-280 -20,-250 0,-252 C20,-250 46,-280 34,-340', stroke: '#2b3a55', 'stroke-width': 6, fill: 'none' }, torso);
    el('circle', { cx: 0, cy: -250, r: 9, fill: '#8a99b5' }, torso);
  }
  let core = null, coreGlow = null;
  if (c.hero) {
    el('path', { d: 'M-68,-336 L0,-262 L68,-336', stroke: c.trim, 'stroke-width': 7, fill: 'none', 'stroke-linejoin': 'round' }, torso);
    el('rect', { x: -54, y: -214, width: 108, height: 22, rx: 7, fill: c.trim }, torso);
    el('rect', { x: -14, y: -217, width: 28, height: 28, rx: 6, fill: '#ffe08a', stroke: '#9a6b12', 'stroke-width': 3 }, torso);
    coreGlow = el('circle', { cx: 0, cy: -292, r: 70, fill: 'url(#gCore)' }, torso);
    el('circle', { cx: 0, cy: -292, r: 24, fill: '#0a1224', stroke: c.trim, 'stroke-width': 5 }, torso);

  if (c.hairStyle === 'long') el('path', { d: 'M-58,-10 C-62,-72 62,-72 58,-10 L62,62 Q0,78 -62,62Z', fill: c.hair }, head);

  if (c.hairStyle === 'bun') el('circle', { cx: 0, cy: -60, r: 22, fill: c.hair }, head);
  el('path', { d: c.hairStyle === 'bald' ? 'M-52,-8 C-50,-30 -40,-40 -30,-44 L-44,-10Z M52,-8 C50,-30 40,-40 30,-44 L44,-10Z' : 'M-55,-4 C-62,-72 62,-76 55,-6 C46,-28 30,-30 18,-40 C0,-24 -30,-30 -55,-4Z', fill: c.hair }, head);
  if (c.mask) el('path', { d: 'M-56,-18 Q-30,-32 0,-20 Q30,-32 56,-18 L52,10 Q30,18 0,6 Q-30,18 -52,10Z', fill: c.suitDark }, head);

    const eg = el('g', { transform: `translate(${s * 22},-4)` }, head);
    const lid = el('g', {}, eg);
    el('ellipse', { rx: c.mask ? 14 : 11, ry: c.mask ? 11 : 12, fill: '#fff' }, lid);
    const pupil = el('circle', { r: c.mask ? 5.5 : 6.5, fill: '#10162b' }, lid);
    const brow = el('path', { d: 'M-15,0 L15,0', stroke: c.mask ? c.suitDark : c.hair, 'stroke-width': 7, 'stroke-linecap': 'round' }, eg);

  const armsG = el('g', {}, body);
  const mkArm = () => ({ up: el('path', { stroke: c.coat ? '#f4f7fb' : c.suit, 'stroke-width': 28, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, armsG), hand: el('circle', { r: 17, fill: c.glove }, armsG) });

      const cb = q.capeLen ?? -30;

const ALLIES = {
  ami: { suit: '#ff8a3d', pants: '#2a3350', boots: '#2a2d3a', skin: '#c98b62', hair: '#1b1b2f', glove: '#c98b62', mask: false, hasCape: false, hero: false, hairStyle: 'long' },
  medecin: { suit: '#7fb3e6', pants: '#33415c', boots: '#2a2d3a', skin: '#f2c39b', hair: '#6b4a2b', glove: '#f2c39b', mask: false, hasCape: false, hero: false, coat: true },
  psy: { suit: '#7a5cff', pants: '#2b2d42', boots: '#2a2d3a', skin: '#8d5a3b', hair: '#1b1b2f', glove: '#8d5a3b', mask: false, hasCape: false, hero: false, hairStyle: 'bun' },
  famille: { suit: '#2ecc71', pants: '#3a3f55', boots: '#2a2d3a', skin: '#f0c29a', hair: '#c9ccd6', glove: '#f0c29a', mask: false, hasCape: false, hero: false, hairStyle: 'bald' },

// ---------------------------------------------------------------------------
// Éléments graphiques communs
// ---------------------------------------------------------------------------
function makeEmbers(parent, n, seed, area = [0, 0, W, H]) {

      set(h.hx, { transform: `translate(${h.x},${h.y}) scale(${fmt(Math.max(k, .001) * (1 + lit * .06))})` });
      h.poly.setAttribute('fill', mix('#1c2747', '#f5c04a', lit)); h.tx.setAttribute('fill', mix('#8a9ab8', '#1b1b2f', lit));
      if (i < 2) h.ring.setAttribute('opacity', fmt(p(t, a + 2.4, a + 2.7) * (.6 + .4 * Math.sin(t * 6))));
    });
    items.forEach(it => { const k = p(t, it.t0, it.t0 + .45, E.out); set(it.g, { opacity: fmt(k), transform: `translate(${fmt((1 - k) * -60)},0)` }); });
    foot.update(540, 1700, p(t, a + 4.1, a + 4.5, E.back)); foot2.update(540, 1780, p(t, a + 4.3, a + 4.7, E.back));
  };
}, .03);

// ====== L'ÉQUIPE SE RASSEMBLE (74 – 81 s) ===================================
S(74, 81, (root, cam) => {
  const a = 74;
  el('rect', { width: W, height: H, fill: 'url(#gBg)' }, cam);
  const sun = el('rect', { width: W, height: H, fill: 'url(#gSunrise)', opacity: 0 }, cam);
  const lines = makeSpeedLines(cam, 540, 1350, 40, '#ffd56b', .1);
  const embers = makeEmbers(cam, 40, 77);
  el('rect', { x: 0, y: 1600, width: W, height: 320, fill: '#0b1020' }, cam);
  const allies = [['ami', 150, 'AMI·E', 75.2], ['medecin', 340, 'MÉDECIN', 75.6], ['psy', 740, 'PSY', 76.0], ['famille', 930, 'FAMILLE', 76.4]].map(([k, x, lab, t0]) => ({ h: makeHero(cam, ALLIES[k]), x, t0, lab: pill(cam, lab, { size: 26, bg: '#fff', color: '#1b2546' }) }));
  const hero = makeHero(cam);
  const t1 = metalText(cam, 'MÊME LES HÉROS', { x: 540, y: 270, size: 96, anchor: 'middle', ls: 2 });
  const t2 = metalText(cam, "ONT BESOIN D'AIDE", { x: 540, y: 375, size: 96, anchor: 'middle', ls: 2 });
  const sub = metalText(cam, "Demander de l'aide, c'est une force.", { x: 540, y: 470, size: 48, anchor: 'middle', grad: 'gGold', depth: 2 });
  const flare = makeFlare(cam);
  return t => {
    sun.setAttribute('opacity', fmt(p(t, a + .5, a + 4)));
    lines.update(t); embers.update(t, p(t, a + 2, a + 4));
    const up = p(t, 78.3, 78.7, E.back);
    allies.forEach((al, i) => {
      const k = p(t, al.t0, al.t0 + .6, E.out5), dir = al.x < 540 ? -1 : 1;
      al.h.update({ t: t + i, x: al.x + dir * (1 - k) * 500, y: 1560, s: .74, op: k, mood: .8, look: [-dir * 4, 0],
        hR: dir > 0 ? [92, -168] : [lerp(92, 70, up), lerp(-168, -560, up)], hL: dir < 0 ? [-92, -168] : [lerp(-92, -70, up), lerp(-168, -560, up)] });
      al.lab.update(al.x + dir * (1 - k) * 500, 1615, k);
    });
    const rise = p(t, a + .3, a + 3.5);
    hero.update({ t, x: 540, y: 1660, s: 1.12, drop: 60 * (1 - rise), headDown: 16 * (1 - rise), mood: lerp(-.4, 1, rise), sad: 1 - rise, eyes: lerp(.5, 1, rise),
      hR: [lerp(92, 60, up), lerp(-168, -580, up)], capeAmp: lerp(.2, 1.6, rise), core: lerp(.1, 1, p(t, a + 1, a + 4)) });
    [t1, t2].forEach((m, i) => { const k = p(t, a + 1.6 + i * .2, a + 2.2 + i * .2, E.out5); set(m.g, { opacity: fmt(k), transform: `translate(0,${fmt((1 - k) * -40)})` }); m.shine(p(t, a + 2.4 + i * .2, a + 3.4 + i * .2)); });
    const sk = p(t, a + 2.8, a + 3.3); set(sub.g, { opacity: fmt(sk) }); sub.shine(p(t, a + 4.4, a + 5.2));
    shake = Math.max(0, 1 - Math.abs(t - 78.4) / .25) * .5;
    flare.update(lerp(-300, 1400, p(t, 78.2, 79.8)), 1080, Math.sin(p(t, 78.2, 79.8, E.lin) * Math.PI));
  };
}, .05);

// ====== FIN : OÙ TROUVER DE L'AIDE (81 – 88 s) ==============================
S(81, 88, (root, cam) => {
  const a = 81;
  el('rect', { width: W, height: H, fill: 'url(#gBg)' }, cam);
  const embers = makeEmbers(cam, 25, 31);
  const q1 = metalText(cam, 'VOUS VOUS', { x: 540, y: 330, size: 92, anchor: 'middle', ls: 2 });
  const q2 = metalText(cam, 'RECONNAISSEZ ?', { x: 540, y: 430, size: 92, anchor: 'middle', ls: 2 });
  const tx = wrapLines('Parlez-en à votre *médecin*, à un *psychologue* ou à un *proche*.', 44, 900).map((ln, j) => richText(cam, ln, { x: 540, y: 560 + j * 58, 'text-anchor': 'middle', 'font-size': 44, 'font-weight': 600, fill: '#dfe6f2' }));
  const card = el('g', {}, cam);
  el('rect', { x: -440, y: -240, width: 880, height: 480, rx: 40, fill: 'url(#gRedMetal)', stroke: '#fff', 'stroke-width': 8 }, card);
  el('text', { y: -120, 'text-anchor': 'middle', 'font-size': 36, 'font-weight': 800, fill: '#fff', 'letter-spacing': 3 }, card).textContent = 'BESOIN DE PARLER ?';
  el('text', { y: 60, 'text-anchor': 'middle', 'font-size': 200, 'font-weight': 900, fill: '#fff' }, card).textContent = '3114';
  el('text', { y: 135, 'text-anchor': 'middle', 'font-size': 34, 'font-weight': 700, fill: '#fff' }, card).textContent = 'Numéro national de prévention du suicide';
  el('text', { y: 190, 'text-anchor': 'middle', 'font-size': 34, 'font-weight': 900, fill: '#ffe08a' }, card).textContent = 'Gratuit · 24h/24 · 7j/7';
  const urg = el('text', { x: 540, y: 1520, 'text-anchor': 'middle', 'font-size': 38, 'font-weight': 700, fill: '#fff' }, cam);
  urg.textContent = 'Danger immédiat : appelez le 15 ou le 112';
  const hero = makeHero(cam);
  const fade = el('rect', { width: W, height: H, fill: '#000', opacity: 0 }, root);
  return t => {
    embers.update(t, .6);
    [q1, q2].forEach((m, i) => { const k = p(t, a + .3 + i * .15, a + .9 + i * .15, E.out5); set(m.g, { opacity: fmt(k), transform: `translate(0,${fmt((1 - k) * -40)})` }); m.shine(p(t, a + 1 + i * .2, a + 2 + i * .2)); });
    tx.forEach((d, j) => d.setAttribute('opacity', fmt(p(t, a + 1 + j * .2, a + 1.5 + j * .2))));
    const ck = p(t, a + 1.6, a + 2.2, E.back);
    set(card, { transform: `translate(540,1060) scale(${fmt(Math.max(.001, ck))})` });
    urg.setAttribute('opacity', fmt(p(t, a + 2.5, a + 3)));
    hero.update({ t, x: 540, y: 1880, s: .55, mood: 1, core: 1, op: p(t, a + 3, a + 3.6), hR: [60, -560] });
    fade.setAttribute('opacity', fmt(p(t, 86.8, 88)));
  };
}, .03);

// ---------------------------------------------------------------------------
// Sous-titres (intro du héros)
// ---------------------------------------------------------------------------
const CAPS = [
  [8.0, 10.6, 'Voici *Alex*. Un héros du quotidien.'],
  [10.8, 12.85, 'Mais Alex mène un *combat invisible* : la *dépression*.'],
];
const capLayer = el('g', {}, svg);
const caps = CAPS.map(([a, b, txt]) => {
  const g = el('g', {}, capLayer);
  const bg = el('rect', { rx: 34, fill: '#05070f', opacity: .85, stroke: '#f5c04a', 'stroke-width': 3 }, g);
  const ls = wrapLines(txt, 44, 900, 700);
  const tl = ls.map((ln, j) => richText(g, ln, { x: 0, y: 15 + (j - (ls.length - 1) / 2) * 56, 'text-anchor': 'middle', 'font-size': 44, 'font-weight': 700, fill: '#fff' }));
  const wd = Math.max(...tl.map(x => x.getComputedTextLength())), hh = ls.length * 56 + 40;
  set(bg, { x: -wd / 2 - 40, y: -hh / 2, width: wd + 80, height: hh });
  return { a, b, g };
});

// ---------------------------------------------------------------------------
// Transitions : bandes obliques rouge / or / nuit
// ---------------------------------------------------------------------------
const BOUNDS = [7, 13, 19, 25, 31, 37, 43, 49, 55, 61, 67.5, 74, 81];
const trLayer = el('g', {}, svg);
const bars = [['#e23636', -.1], ['#f5c04a', -.05], ['#0b1020', 0]].map(([c, d]) => ({ e: el('path', { fill: c }, trLayer), d }));
const edge = el('path', { fill: '#fff', opacity: .9 }, trLayer);
const barPath = (cx, w) => `M${fmt(cx - w / 2 + 360)},0 L${fmt(cx + w / 2 + 360)},0 L${fmt(cx + w / 2 - 360)},${H} L${fmt(cx - w / 2 - 360)},${H}Z`;

function renderAt(t) {
  t = clamp(t, 0, DUR - 1e-6);
  shake = 0;
  for (const s of scenes) {
    const vis = t >= s.a && t < s.b;
    s.root.setAttribute('display', vis ? '' : 'none');
    if (vis) s.upd(t);
  }
  sceneLayer.setAttribute('transform', shake > 0 ? `translate(${fmt(Math.sin(t * 90) * 18 * shake)},${fmt(Math.cos(t * 70) * 14 * shake)})` : '');
  for (const c of caps) {
    if (t < c.a || t > c.b) { c.g.setAttribute('display', 'none'); continue; }
    c.g.removeAttribute('display');
    const k = p(t, c.a, c.a + .4, E.back), out = p(t, c.b - .3, c.b, E.in);
    set(c.g, { transform: `translate(540,${fmt(1790 + (1 - k) * 40 + out * 30)}) scale(${fmt(.85 + .15 * k)})`, opacity: fmt(Math.min(p(t, c.a, c.a + .2), 1 - out)) });
  }
  let active = null;
  for (const b of BOUNDS) if (Math.abs(t - b) < .6) active = b;
  bars.forEach(br => {
    if (active === null) { br.e.setAttribute('d', ''); return; }
    const u = (t - active - br.d + .45) / .9;
    br.e.setAttribute('d', u <= 0 || u >= 1 ? '' : barPath(lerp(-1700, 2780, E.inOut(u)), 1900));
  });
  if (active !== null) { const u = (t - active + .45) / .9; edge.setAttribute('d', u <= 0 || u >= 1 ? '' : barPath(lerp(-1700, 2780, E.inOut(u)) + 960, 14)); }
  else edge.setAttribute('d', '');
}
window.renderAt = renderAt;
window.DURATION = DUR;
window.ready = true;

// ---------------------------------------------------------------------------
// Lecteur (aperçu navigateur)
// ---------------------------------------------------------------------------
if (!RENDER) {
  const btn = document.getElementById('play'), seek = document.getElementById('seek'), tl = document.getElementById('time');
  let playing = true, t0 = performance.now(), cur = 0;
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'Pause' : 'Lecture'; t0 = performance.now() - cur * 1000; };
  seek.oninput = () => { cur = +seek.value; t0 = performance.now() - cur * 1000; renderAt(cur); };
  (function loop(now) {
    if (playing) { cur = ((now - t0) / 1000) % DUR; seek.value = cur; renderAt(cur); tl.textContent = cur.toFixed(1) + 's'; }
    requestAnimationFrame(loop);
  })(performance.now());
} else renderAt(0);
</script>
</body>
