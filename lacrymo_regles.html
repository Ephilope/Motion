<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lacrymo et règles</title>
</head>
<body>
<!-- Vidéo TikTok « Le gaz lacrymogène pourrait dérégler tes règles », reliée aux manifs du 17 octobre 2026
     (charte : docs/MODELE.md), avec Séléné en bas à gauche.
     Voix-off : scripts/lacrymo_regles.txt → node tools/voix.mjs lacrymo_regles ; node tools/enveloppe.mjs lacrymo_regles
     Chiffres et sources : en tête de scripts/lacrymo_regles.txt. -->
<script src="lib/motion.js"></script>
<script src="assets/lacrymo_regles_words.js"></script>
<script src="assets/lacrymo_regles_env.js"></script>
<script src="lib/selene.js"></script>
<script>
(async () => {
const { M, setup, start, S, Wt, captions, addShake, E, p, pop, lerp, clamp, fmt, el, set, show, tf, txt, title, card, chip, emoji, bg } = Motion;
await setup({
  duration: 62,
  words: window.WORDS,
  audio: 'assets/voix_lacrymo_regles.mp3',
  emojis: '⏰💨💊🩸🪖💉🧪📋😣😰💬👇👀🇺🇸🇫🇷🔬',
});
const { W, H, CX } = M, { GREEN, RED, CREAM, INK, WHITE } = M.C;
const YELLOW = '#FFD23F', GAS = '#C9D6B8', GAS2 = '#AFC19A', BLUE = '#3498DB', PINK = '#F5A3B5', GREY = '#7F8C8D';

// --- briques propres à cette vidéo ----------------------------------------------
const at = (g, x, y, s = 1, r = 0) => tf(g, x, y, s, r);
const hit = (t, t0, w = .3) => Math.max(0, 1 - Math.abs(t - t0) / w);
const shock = (t, t0, w = .3, k = .5) => addShake(hit(t, t0, w) * k);
// Tampon : arrive grossi puis claque à sa taille.
function stamp(parent, str, color = RED, size = 100) {
  const g = el('g', {}, parent), inner = el('g', {}, g);
  const t = txt(inner, str, { size, fill: color });
  t.t.setAttribute('y', size * .36);
  const w = t.w + size * .9, h = size * 1.5;
  inner.insertBefore(el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 22, fill: CREAM, stroke: color, 'stroke-width': 14 }), t.g);
  inner.insertBefore(el('rect', { x: -w / 2 + 12, y: -h / 2 + 12, width: w, height: h, rx: 22, fill: INK }), inner.firstChild);
  return { g, update(x, y, t, t0, r = -8) { const k = clamp((t - t0) / .18); show(g, t >= t0); tf(g, x, y, 1, r); tf(inner, 0, 0, lerp(2.6, 1, E.out(k))); g.setAttribute('opacity', fmt(Math.min(1, k * 2))); } };
}
// Grand nombre avec contour noir.
function bigNum(parent, size, fill = RED) {
  const t = el('text', { 'text-anchor': 'middle', 'font-size': size, y: size * .36, fill, stroke: INK, 'stroke-width': size * .09, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, parent);
  return { t, set(s) { t.textContent = s; } };
}
// Nuage de gaz lacrymo : bulles vert-gris qui gonflent et ondulent (≈ 2·r de large).
function gasCloud(parent, r = 200, seed = 1) {
  const g = el('g', {}, parent);
  const puffs = Array.from({ length: 9 }, (_, i) => {
    const a = i / 9 * Math.PI * 2 + seed, d = r * (.35 + .25 * ((i * 7 + seed * 3) % 5) / 4);
    return { x: Math.cos(a) * d, y: Math.sin(a) * d * .6, r: r * (.38 + .12 * ((i * 3 + seed) % 4) / 3), ph: i * .7 + seed,
      c: el('circle', { fill: i % 2 ? GAS : GAS2, stroke: INK, 'stroke-width': 6 }, g) };
  });
  const core = el('circle', { r: r * .5, fill: GAS }, g);
  return { g, update(t, k = 1) {
    puffs.forEach(o => set(o.c, { cx: fmt(o.x + 8 * Math.sin(t * 1.3 + o.ph)), cy: fmt(o.y + 6 * Math.cos(t * 1.1 + o.ph)), r: fmt(Math.max(0, o.r * k * (1 + .06 * Math.sin(t * 2 + o.ph)))) }));
    set(core, { r: fmt(r * .5 * k) });
  } };
}
// Grenade lacrymo stylisée (≈ 90 × 200) qui fume.
function canister(parent) {
  const g = el('g', {}, parent);
  card(g, -45, -80, 90, 170, GREY, 14, 8, 6);
  el('rect', { x: -45, y: -40, width: 90, height: 26, fill: YELLOW, stroke: INK, 'stroke-width': 5 }, g);
  el('rect', { x: -22, y: -110, width: 44, height: 34, rx: 6, fill: INK }, g);
  return g;
}
// Calendrier de 12 mois ; mark(i, état) colore un mois (0 vide, 1 règles prévues, 2 règles en plus).
function calendar(parent) {
  const g = el('g', {}, parent);
  card(g, -330, -250, 660, 500, WHITE, 26, 12, 8);
  el('rect', { x: -330, y: -250, width: 660, height: 90, rx: 26, fill: RED, stroke: INK, 'stroke-width': 8 }, g);
  txt(g, 'UN AN SOUS PILULE', { size: 44, fill: CREAM }).g.setAttribute('transform', 'translate(0,-190)');
  const names = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
  const cells = names.map((n, i) => {
    const x = -255 + (i % 4) * 170, y = -95 + Math.floor(i / 4) * 115;
    const c = el('g', {}, g);
    const r = el('rect', { x: -70, y: -48, width: 140, height: 96, rx: 16, fill: CREAM, stroke: INK, 'stroke-width': 5 }, c);
    txt(c, n, { size: 40 }).g.setAttribute('transform', 'translate(-40,-8)');
    const drop = el('g', {}, c); emoji(drop, '🩸', 52); tf(drop, 28, 4, 0);
    tf(c, x, y, 1);
    return { r, drop };
  });
  return { g, mark(i, s, k = 1) { const c = cells[i]; set(c.r, { fill: s === 2 ? '#F9C9C9' : CREAM }); tf(c.drop, 28, 4, s ? k : 0); } };
}
// Page de calendrier « 17 OCT » (≈ 200 × 220), à la place de l'emoji 📅 qui affiche « July ».
function calPage(parent) {
  const g = el('g', {}, parent);
  card(g, -100, -110, 200, 220, WHITE, 22, 10, 7);
  el('rect', { x: -100, y: -110, width: 200, height: 70, rx: 22, fill: RED, stroke: INK, 'stroke-width': 7 }, g);
  txt(g, 'OCT', { size: 44, fill: CREAM }).g.setAttribute('transform', 'translate(0,-60)');
  txt(g, '17', { size: 110 }).g.setAttribute('transform', 'translate(0,80)');
  return g;
}
// Anneau de pourcentage.
function ring(parent, R = 230, col = RED) {
  const g = el('g', {}, parent), C = 2 * Math.PI * R;
  el('circle', { r: R, fill: 'none', stroke: INK, 'stroke-width': 104 }, g);
  el('circle', { r: R, fill: 'none', stroke: CREAM, 'stroke-width': 86 }, g);
  const arc = el('circle', { r: R, fill: 'none', stroke: col, 'stroke-width': 86, transform: 'rotate(-90)', 'stroke-dasharray': `0 ${fmt(C)}` }, g);
  const n = el('g', {}, g), nS = bigNum(n, 120, col);
  return { g, set(k, label) { set(arc, { 'stroke-dasharray': `${fmt(C * k)} ${fmt(C)}` }); nS.set(label); } };
}
// Barre verticale avec étiquette sous la base.
function vbar(parent, label, col) {
  const g = el('g', {}, parent);
  const sh = el('rect', { x: -110 + 12, width: 220, rx: 14, fill: INK }, g), r = el('rect', { x: -110, width: 220, rx: 14, fill: col, stroke: INK, 'stroke-width': 7 }, g);
  title(g, label, { size: 44, shadow: 0, lh: 1.05 }).setAttribute('transform', 'translate(0,80)');
  const v = el('g', {}, g), vN = bigNum(v, 84, col);
  return { g, v, vN, setH(h) { h = Math.max(4, h); set(r, { y: fmt(-h), height: fmt(h) }); set(sh, { y: fmt(-h + 12), height: fmt(h) }); tf(v, 0, -h - 70, 1); } };
}

// --- débuts de scène, calés sur la voix ------------------------------------------
const T = {
  samedi: Wt('Samedi') - .2, deja: Wt('ensuite') - .3, pilule: Wt('Une', 1, Wt('États-Unis')) - .2,
  trans: Wt('Des', 1, Wt('mois')) - .2, etude: Wt('Des', 1, Wt('revenir')) - .2, sympt: Wt('Crampes') - .2,
  dose: Wt('Et', 1, Wt('abondants')) - .2, pourquoi: Wt('Mais') - .2, attention: Wt('Attention') - .2,
  cta: Wt('Alors', 2) - .2,
};
const tDis = Wt('Dis-le');

// ====== 1. ACCROCHE : le 17 octobre, le gaz lacrymo et tes règles ================================
// Le sujet est à l'écran dès la première image (beaucoup regardent sans le son).
S(0, T.samedi, (cam) => {
  const tSurv = Wt('surveille'), tGaz = Wt('gaz'), tMeme = Wt('même'), tPil = Wt('pilule');
  bg(cam);
  const tag = chip(cam, 'MANIF DU 17 OCTOBRE', RED, CREAM, 54);
  const head = title(cam, [['LE GAZ LACRYMO', INK], 'ET', ['TES RÈGLES', RED]], { size: 90, shadow: 0, sw: 12 });
  const cloud = gasCloud(cam, 210, 1);
  const can = canister(cam);
  const cal = calPage(cam);
  const drop = el('g', {}, cam); emoji(drop, '🩸', 110);
  const pill = el('g', {}, cam); emoji(pill, '💊', 120);
  const st = stamp(cam, 'MÊME SOUS PILULE', RED, 70);
  return t => {
    tag.update(CX, 250, pop(t, 0, .3), -2);
    at(head, CX, 470, lerp(1.12, 1, p(t, 0, .3, E.out)), -2);
    // le nuage de gaz monte de la grenade, puis le calendrier et la goutte
    at(can, CX - 330, 900, pop(t, .2, .3), -12);
    at(cloud.g, CX - 250, 800, 1); cloud.update(t, .45 * p(t, tGaz - .6, tGaz + .4, E.out));
    at(cal, CX + 250, 800, pop(t, tSurv - .1, .35), 4);
    at(drop, CX + 360, 900 + 6 * Math.sin(t * 5), pop(t, tSurv + .3, .3));
    at(pill, CX + 10, 850, pop(t, tPil - .3, .3), -10);
    st.update(CX, 1080, t, tMeme, -4);
    shock(t, .2, .3, .6); shock(t, tPil + .1, .3, .6);
  };
});

// ====== 2. SAMEDI : plus de 500 000 manifestants, beaucoup de jeunes, beaucoup de gaz ==============
S(T.samedi, T.deja, (cam, a) => {
  const tPers = Wt('personnes'), tJeu = Wt('jeunes'), tGaz = Wt('gaz', 1, tJeu);
  bg(cam);
  const tag = chip(cam, 'SAMEDI 17 OCTOBRE', INK, CREAM, 52);
  const plus = title(cam, ['PLUS DE'], { size: 64, shadow: 0 });
  const n = el('g', {}, cam), nS = bigNum(n, 190, RED); nS.set('500 000');
  const lab = chip(cam, 'MANIFESTANTS EN FRANCE', RED, CREAM, 46);
  const c1 = chip(cam, 'BEAUCOUP DE JEUNES', GREEN, CREAM, 50);
  const cloud = gasCloud(cam, 170, 3);
  const c2 = chip(cam, 'BEAUCOUP DE GAZ', INK, CREAM, 50);
  return t => {
    tag.update(CX, 250, pop(t, a + .05), -2);
    at(plus, CX, 380, pop(t, Wt('plus') - .2, .3), -2);
    at(n, CX, 500, pop(t, Wt('500 000') - .2, .35), -3);
    // le compteur grimpe jusqu'à 500 000
    nS.set((Math.round(500 * p(t, Wt('500 000') - .2, tPers + .2, E.out)) * 1000).toLocaleString('fr-FR').replace(/ | /g, ' '));
    lab.update(CX, 690, pop(t, tPers), 2);
    c1.update(CX, 850, pop(t, tJeu - .3), -3);
    at(cloud.g, CX, 1040, 1); cloud.update(t, .8 * p(t, tGaz - .5, tGaz + .3, E.out));
    c2.update(CX, 1040, pop(t, tGaz - .1), 2);
    shock(t, tPers, .3, .5); shock(t, tGaz + .1, .3, .6);
  };
}, { swipe: RED });

// ====== 3. ON L'A DÉJÀ VU : Portland, été 2020 ===================================================
S(T.deja, T.pilule, (cam, a) => {
  const tArr = Wt('arriver'), tVu = Wt('vu'), tEte = Wt('Été', 1, a), tPor = Wt('Portland');
  bg(cam);
  const head = title(cam, ['ET ENSUITE ?', ['ON L\'A DÉJÀ VU', RED]], { size: 96, shadow: 0, sw: 12 });
  const eyes = el('g', {}, cam); emoji(eyes, '👀', 170);
  const flag = el('g', {}, cam); emoji(flag, '🇺🇸', 170);
  const c1 = chip(cam, 'PORTLAND, ÉTATS-UNIS', BLUE, CREAM, 52);
  const c2 = chip(cam, 'ÉTÉ 2020', RED, CREAM, 60);
  return t => {
    const out = p(t, tEte - .4, tEte - .1, E.in);
    at(head, CX, 520 - 200 * out, pop(t, a + .05, .35) * (1 - .3 * out), -2);
    at(eyes, CX, 780, pop(t, tVu - .3, .35) * (1 - out));
    at(flag, CX, 640, pop(t, tPor - .3, .35));
    c1.update(CX, 840, pop(t, tPor), -2);
    c2.update(CX, 1010, pop(t, tEte), 3);
    shock(t, tVu + .1, .25, .4); shock(t, tPor + .1, .25, .4);
  };
}, { swipe: RED });

// ====== 4. SOUS PILULE : 4 règles par an… puis le lendemain de chaque gazage ======================
S(T.pilule, T.trans, (cam, a) => {
  const tFil = Wt('fille'), t26 = Wt('26'), tPil = Wt('pilule', 1, a), t4 = Wt('4'), tLen = Wt('lendemain'), tGaz = Wt('gazage'), t3 = Wt('3', 1, a), t2 = Wt('2', 1, t3);
  bg(cam);
  const tag = chip(cam, 'ELLE A 26 ANS', INK, CREAM, 52);
  const cal = calendar(cam);
  const n = el('g', {}, cam), nS = bigNum(n, 96, RED); nS.set('3 FOIS EN 2 MOIS');
  const lab = chip(cam, 'LE LENDEMAIN DU GAZ', RED, CREAM, 50);
  return t => {
    tag.update(CX, 250, pop(t, t26 - .3), -2);
    at(cal.g, CX, 640, .95 * pop(t, tPil - .3, .35));
    // 4 règles prévues (une par trimestre), puis 3 en plus en juin-juillet
    [0, 3, 6, 9].forEach((m, i) => cal.mark(m, 1, pop(t, t4 - .1 + i * .15, .25)));
    [4, 5, 7].forEach((m, i) => { const t0 = tGaz + .1 + i * .35; cal.mark(m, t >= t0 ? 2 : 0, pop(t, t0, .25)); });
    lab.update(CX, 960, pop(t, tLen - .2), 2);
    at(n, CX, 1080, pop(t, t3 - .2, .35), -3);
    shock(t, tGaz + .2, .3, .6); shock(t, t2 + .2, .3, .5);
  };
}, { swipe: GREEN });

// ====== 5. SOUS TESTOSTÉRONE : les règles reviennent ============================================
S(T.trans, T.etude, (cam, a) => {
  const tHom = Wt('hommes'), tTes = Wt('testostérone'), tPlus = Wt('plus', 1, a), tRev = Wt('revenir');
  bg(cam);
  const tag = chip(cam, 'HOMMES TRANS', INK, CREAM, 56);
  const syr = el('g', {}, cam); emoji(syr, '💉', 190);
  const c1 = chip(cam, 'SOUS TESTOSTÉRONE', BLUE, CREAM, 52);
  const no = el('g', {}, cam); emoji(no, '🩸', 150);
  const x = el('path', { d: 'M-80,-80 L80,80 M80,-80 L-80,80', stroke: RED, 'stroke-width': 26, 'stroke-linecap': 'round' }, cam);
  const head = title(cam, ['LES RÈGLES', ['REVIENNENT', RED]], { size: 110, shadow: 0, sw: 12 });
  return t => {
    tag.update(CX, 250, pop(t, tHom - .3), -2);
    at(syr, CX - 200, 520, pop(t, tTes - .4, .35), -20);
    c1.update(CX, 700, pop(t, tTes - .1), -2);
    const back = p(t, tRev - .4, tRev, E.out);
    at(no, CX + 200, 520 + 8 * Math.sin(t * 4), pop(t, tPlus - .2, .35) * (1 + .15 * back));
    at(x, CX + 200, 520, pop(t, tPlus, .3) * (1 - back));
    at(head, CX, 930, pop(t, tRev - .4, .35), -2);
    shock(t, tRev + .1, .3, .6);
  };
}, { swipe: RED });

// ====== 6. L'ÉTUDE : 2 000 personnes gazées, plus d'une sur deux perturbée =======================
S(T.etude, T.sympt, (cam, a) => {
  const tCher = Wt('chercheurs'), t2000 = Wt('2 000'), tPlus = Wt('Plus', 1, Wt('là-bas')), tPer = Wt('perturbé');
  bg(cam);
  const tag = chip(cam, 'UNE ÉTUDE À PORTLAND', INK, CREAM, 50);
  const lab1 = chip(cam, '+ DE 2 000 PERSONNES GAZÉES', BLUE, CREAM, 44);
  const rg = ring(cam, 210, RED);
  const head = title(cam, [['CYCLE PERTURBÉ', RED]], { size: 92, shadow: 0, sw: 12 });
  return t => {
    tag.update(CX, 250, pop(t, tCher - .3), -2);
    lab1.update(CX, 400, pop(t, t2000 - .2), 2);
    at(rg.g, CX, 700, pop(t, tPlus - .4, .35));
    const k = .545 * p(t, tPlus - .2, tPer, E.out);
    rg.set(k, Math.round(k * 100) + ' %');
    at(head, CX, 1050, pop(t, tPer - .4, .35), -2);
    shock(t, tPer + .1, .3, .6);
  };
}, { swipe: GREEN });

// ====== 7. LES SYMPTÔMES : crampes, règles en avance, saignements ================================
S(T.sympt, T.dose, (cam, a) => {
  const tCra = Wt('Crampes'), tAva = Wt('avance'), tSai = Wt('saignements');
  bg(cam);
  const tag = chip(cam, 'CE QU\'ELLES DÉCRIVENT', INK, CREAM, 50);
  const items = [['😣', 'CRAMPES', tCra, RED], ['⏰', 'RÈGLES EN AVANCE', tAva - .3, INK], ['🩸', 'SAIGNEMENTS +', tSai, RED]].map(([e, s, t0, col], i) => {
    const g = el('g', {}, cam);
    card(g, -430, -80, 860, 160, i === 1 ? WHITE : '#FDE2E2', 30, 10, 7);
    const ic = el('g', {}, g); emoji(ic, e, 100); tf(ic, -340, 0, 1);
    const l = txt(g, s, { size: 58, fill: col, anchor: 'start', sw: col === INK ? 0 : 8 }); l.g.setAttribute('transform', 'translate(-260,23)');
    return { g, t0, y: 480 + i * 220 };
  });
  return t => {
    tag.update(CX, 250, pop(t, a + .05), -2);
    items.forEach(o => at(o.g, CX, o.y, pop(t, o.t0 - .1, .3), 0));
    items.forEach(o => shock(t, o.t0 + .1, .25, .3));
  };
}, { swipe: RED });

// ====== 8. EFFET DOSE : après 5 jours de gaz, 2 fois plus de crampes =============================
S(T.dose, T.pourquoi, (cam, a) => {
  const t5 = Wt('5'), tGaz = Wt('gaz', 1, t5), t2 = Wt('2', 1, tGaz), tCra = Wt('crampes', 1, t2);
  bg(cam);
  const tag = chip(cam, 'CRAMPES EN PLUS', INK, CREAM, 52);
  const b1 = vbar(cam, ['1 JOUR', 'DE GAZ'], GREEN), b2 = vbar(cam, ['5 JOURS', 'DE GAZ'], RED);
  const n = el('g', {}, cam), nS = bigNum(n, 170, RED); nS.set('× 2');
  return t => {
    tag.update(CX, 250, pop(t, a + .05), -2);
    const base = 990, full = 560;
    const k1 = p(t, a + .1, a + .6, E.out), k2 = p(t, t5 - .1, tGaz + .4, E.out);
    b1.setH(full * .243 / .509 * k1); b2.setH(full * k2);
    b1.vN.set(Math.round(24.3 * k1) + ' %'); b2.vN.set(Math.round(50.9 * k2) + ' %');
    at(b1.g, CX - 200, base, pop(t, a + .05, .3)); at(b2.g, CX + 200, base, pop(t, t5 - .2, .3));
    at(n, CX - 200, 470, pop(t, t2 - .2, .35), -6);
    shock(t, t2 + .1, .3, .7);
  };
}, { swipe: GREEN });

// ====== 9. POURQUOI ON NE SAIT PAS : testé dans les années 60 sur des militaires =================
S(T.pourquoi, T.attention, (cam, a) => {
  const tPq = Wt('pourquoi'), t60 = Wt('60'), tMil = Wt('militaires'), tJam = Wt('jamais'), tReg = Wt('règles', 1, tJam);
  bg(cam);
  const q = title(cam, ['POURQUOI', ['ON NE SAIT PAS ?', RED]], { size: 90, shadow: 0, sw: 12 });
  const tag = chip(cam, 'ANNÉES 60', INK, CREAM, 60);
  const sol = el('g', {}, cam); emoji(sol, '🪖', 190);
  const lab = chip(cam, 'TESTÉ SUR DES MILITAIRES', GREEN, CREAM, 48);
  const st = stamp(cam, 'LES RÈGLES ? JAMAIS ÉTUDIÉES', RED, 54);
  return t => {
    const up = p(t, t60 - .6, t60 - .2, E.inOut);
    at(q, CX, lerp(560, 300, up), pop(t, tPq - .3, .35) * lerp(1, .75, up), -2);
    tag.update(CX, 470, pop(t, t60 - .2), -3);
    at(sol, CX, 650, pop(t, t60, .35));
    lab.update(CX, 830, pop(t, tMil - .2), 2);
    st.update(CX, 1040, t, tJam - .1, -4);
    shock(t, tJam + .1, .3, .7);
  };
}, { swipe: RED });

// ====== 10. ATTENTION : rien de prouvé, le stress aussi ==========================================
S(T.attention, T.cta, (cam, a) => {
  const tAuc = Wt('aucune'), tPro = Wt('prouve'), tStr = Wt('stress'), tAus = Wt('aussi', 1, tStr);
  bg(cam);
  const tag = chip(cam, 'ATTENTION', RED, CREAM, 60);
  const head = title(cam, ['AUCUNE ÉTUDE', 'NE PROUVE QUE', ["C'EST LE GAZ", RED]], { size: 82, shadow: 0, sw: 10 });
  const cloud = gasCloud(cam, 120, 4);
  const vs = el('g', {}, cam), vsN = bigNum(vs, 90, INK); vsN.set('OU');
  const str = el('g', {}, cam); emoji(str, '😰', 170);
  const c1 = chip(cam, 'LE GAZ', GREEN, CREAM, 50), c2 = chip(cam, 'LE STRESS', RED, CREAM, 50);
  return t => {
    tag.update(CX, 250, pop(t, a + .05), -2);
    at(head, CX, 470, pop(t, tAuc - .3, .35), -2);
