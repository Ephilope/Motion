<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miniature : abattant des toilettes</title>
</head>
<body>
<!-- Miniature (couverture TikTok) de la vidéo toilettes.html. Rendu : PAGE=miniature_toilettes.html node tools/render.mjs <dossier> --stills 0.9 -->
<script src="lib/motion.js"></script>
<script src="lib/selene.js"></script>
<script>
(async () => {
const { M, setup, start, S, Wt, captions, addShake, E, p, pop, lerp, clamp, fmt, el, set, show, tf, txt, title, card, chip, emoji, bg, hash } = Motion;
await setup({ duration: 1, words: [{ w: 'Bonjour', t0: 5, t1: 6 }], emojis: '🦠' });
const { W, H, CX } = M, { GREEN, RED, CREAM, INK, WHITE } = M.C;
const PORC = '#FFFFFF', SHADE = '#DCE3E8', WATER = '#5DADE2', VIR = '#9B59B6', LASER = '#39FF6A', YELLOW = '#FFD23F', BLUE = '#3498DB';

// --- briques propres à cette vidéo ----------------------------------------------
const at = (g, x, y, s = 1, r = 0) => tf(g, x, y, s, r);
const hit = (t, t0, w = .3) => Math.max(0, 1 - Math.abs(t - t0) / w);
const shock = (t, t0, w = .3, k = .5) => addShake(hit(t, t0, w) * k);
// Tampon : arrive grossi puis claque à sa taille.
function stamp(parent, str, color = RED, size = 100) {
  const g = el('g', {}, parent), inner = el('g', {}, g);
  const t = txt(inner, str, { size, fill: color });
  t.t.setAttribute('y', size * .36);
  const w = t.w + size * .9, h = size * 1.5;
  inner.insertBefore(el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 22, fill: CREAM, stroke: color, 'stroke-width': 14 }), t.g);
  inner.insertBefore(el('rect', { x: -w / 2 + 12, y: -h / 2 + 12, width: w, height: h, rx: 22, fill: INK }), inner.firstChild);
  return { g, update(x, y, t, t0, r = -8) { const k = clamp((t - t0) / .18); show(g, t >= t0); tf(g, x, y, 1, r); tf(inner, 0, 0, lerp(2.6, 1, E.out(k))); g.setAttribute('opacity', fmt(Math.min(1, k * 2))); } };
}
// Grand nombre avec contour noir.
function bigNum(parent, size, fill = RED) {
  const t = el('text', { 'text-anchor': 'middle', 'font-size': size, y: size * .36, fill, stroke: INK, 'stroke-width': size * .09, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, parent);
  return { t, set(s) { t.textContent = s; } };
}
// Toilettes vues de profil, tournées vers la droite (≈ 420 × 480). Origine : centre du bord de la cuvette.
// setLid(k) : 0 = abattant levé contre le réservoir, 1 = abattant fermé.
function toilet(parent) {
  const g = el('g', {}, parent);
  const st = { stroke: INK, 'stroke-width': 9, 'stroke-linejoin': 'round' };
  // Réservoir décalé vers l'arrière : l'abattant levé se range devant lui sans le chevaucher.
  el('rect', { x: -240, y: -8, width: 100, height: 44, rx: 10, fill: PORC, ...st }, g);       // tuyau réservoir → cuvette
  card(g, -335, -330, 110, 340, PORC, 20, 10, 9);                                   // réservoir
  el('rect', { x: -345, y: -350, width: 130, height: 30, rx: 12, fill: PORC, ...st }, g);
  el('rect', { x: -262, y: -300, width: 30, height: 12, rx: 5, fill: SHADE, stroke: INK, 'stroke-width': 5 }, g); // poignée
  el('path', { d: 'M-150,0 L-150,160 Q-150,200 -100,215 L-70,225 L-70,310 L60,310 L60,225 Q170,190 190,40 L190,0 Z', fill: PORC, ...st }, g); // cuvette + pied
  el('path', { d: 'M-130,20 L170,20', stroke: SHADE, 'stroke-width': 12, 'stroke-linecap': 'round' }, g);
  const seat = el('rect', { x: -165, y: -26, width: 370, height: 28, rx: 12, fill: PORC, ...st }, g);
  const lidG = el('g', {}, g), lid = el('g', {}, lidG);
  el('rect', { x: 0, y: -26, width: 380, height: 26, rx: 13, fill: PORC, ...st }, lid);
  el('rect', { x: -186, y: -14, width: 34, height: 26, rx: 8, fill: SHADE, stroke: INK, 'stroke-width': 6 }, g); // charnière
  return { g, seat, lid, setLid(k) { tf(lid, -170, -26, 1, lerp(-90, 0, k)); } };
}
// Virus : boule à piquants avec petits yeux (≈ 90 de large à s = 1).
function virus(parent, col = VIR, s = 1) {
  const g = el('g', {}, parent), b = el('g', {}, g);
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * 2 * Math.PI, c = Math.cos(a), sn = Math.sin(a);
    el('line', { x1: fmt(c * 28), y1: fmt(sn * 28), x2: fmt(c * 46), y2: fmt(sn * 46), stroke: INK, 'stroke-width': 6, 'stroke-linecap': 'round' }, b);
    el('circle', { cx: fmt(c * 48), cy: fmt(sn * 48), r: 8, fill: col, stroke: INK, 'stroke-width': 4 }, b);
  }
  el('circle', { r: 32, fill: col, stroke: INK, 'stroke-width': 7 }, b);
  [-11, 11].forEach(x => { el('circle', { cx: x, cy: -4, r: 8, fill: WHITE, stroke: INK, 'stroke-width': 3 }, b); el('circle', { cx: x + 1, cy: -3, r: 3.5, fill: INK }, b); });
  el('path', { d: 'M-9,12 q9,7 18,0', fill: 'none', stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round' }, b);
  tf(b, 0, 0, s);
  return g;
}
// Bactérie : bâtonnet vert, bien plus grosse qu'un virus.
function bact(parent, col = GREEN, s = 1) {
  const g = el('g', {}, parent), body = el('g', {}, g);
  el('rect', { x: -62, y: -34, width: 124, height: 68, rx: 34, fill: col, stroke: INK, 'stroke-width': 7 }, body);
  [-20, 20].forEach(x => { el('circle', { cx: x, cy: -6, r: 12, fill: WHITE, stroke: INK, 'stroke-width': 4 }, body); el('circle', { cx: x + 2, cy: -4, r: 5, fill: INK }, body); });
  el('path', { d: 'M-12,12 q12,10 24,0', fill: 'none', stroke: INK, 'stroke-width': 5, 'stroke-linecap': 'round' }, body);
  tf(body, 0, 0, s);
  return g;
}
// Nuage de gouttelettes qui monte depuis (0, 0) : k = 0 → au ras de la cuvette, 1 → en haut (hauteur h).
function plume(parent, n, seed, h = 500, spread = 170) {
  const g = el('g', {}, parent);
  const d = Array.from({ length: n }, (_, i) => ({ c: el('circle', { r: fmt(5 + hash(seed + i) * 9), fill: WATER, stroke: INK, 'stroke-width': 3, opacity: .85 }, g), u: hash(seed + i * 3), x: hash(seed + i * 7) * 2 - 1, ph: hash(seed + i * 11) * 6.28 }));
  return { g, update(t, k) {
    d.forEach(o => {
      const kk = clamp(k * (.55 + .6 * o.u));
      tf(o.c, o.x * spread * (.3 + .7 * kk) + Math.sin(t * 2 + o.ph) * 10, -kk * h * (.5 + .5 * o.u) + Math.cos(t * 1.7 + o.ph) * 8, kk > 0 ? 1 : 0);
    });
  } };
}
// Groupe de virus qui flottent autour d'une position.
function viruses(parent, n, seed, rx, ry, s = .5) {
  return Array.from({ length: n }, (_, i) => ({ g: virus(parent, VIR, s * (.75 + hash(seed + i) * .5)), x: (hash(seed + i * 3) * 2 - 1) * rx, y: (hash(seed + i * 7) * 2 - 1) * ry, ph: hash(seed + i * 11) * 6.28, d: hash(seed + i * 13) }));
}
function moveV(vs, t, cx, cy, k, t0 = 0) {
  vs.forEach(v => at(v.g, cx + v.x + Math.sin(t * 2 + v.ph) * 10, cy + v.y + Math.cos(t * 1.6 + v.ph) * 9, k * pop(t, t0 + v.d * .6, .3), Math.sin(t * 2.5 + v.ph) * 20));
}
// Flèche épaisse (de x1,y1 vers x2,y2, légère courbe c).
function arrow(parent, col = BLUE) {
  const g = el('g', {}, parent);
  const pa = el('path', { fill: 'none', stroke: col, 'stroke-width': 18, 'stroke-linecap': 'round' }, g);
  const pa0 = el('path', { fill: 'none', stroke: INK, 'stroke-width': 30, 'stroke-linecap': 'round' }, g); g.insertBefore(pa0, pa);
  const head = el('path', { d: 'M0,-26 L40,0 L0,26 Z', fill: col, stroke: INK, 'stroke-width': 6, 'stroke-linejoin': 'round' }, g);
  return { g, set(x1, y1, x2, y2, c = 0, k = 1) {
    const mx = (x1 + x2) / 2 - (y2 - y1) * c, my = (y1 + y2) / 2 + (x2 - x1) * c;
    const ex = lerp(x1, x2, k), ey = lerp(y1, y2, k);
    const d = `M${fmt(x1)},${fmt(y1)} Q${fmt(lerp(x1, mx, k))},${fmt(lerp(y1, my, k))} ${fmt(ex)},${fmt(ey)}`;
    pa.setAttribute('d', d); pa0.setAttribute('d', d);
    const ang = Math.atan2(ey - lerp(y1, my, k), ex - lerp(x1, mx, k)) * 180 / Math.PI;
    tf(head, ex, ey, k > .05 ? 1 : 0, ang);
  } };
}
// Sol carrelé sous les toilettes (de x0 à x1, à la hauteur y).
function floor(parent, x0, x1, y) {
  const g = el('g', {}, parent);
  el('rect', { x: x0, y, width: x1 - x0, height: 26, rx: 8, fill: '#D5B895', stroke: INK, 'stroke-width': 7 }, g);
  return g;
}


// Nuage toxique : grappe de bulles vertes à contour noir (rx × ry autour de 0, 0), avec des virus dedans.
function toxic(parent, n, seed, rx, ry, rmin = 40, rmax = 90) {
  const g = el('g', {}, parent), back = el('g', {}, g), front = el('g', {}, g);
  for (let i = 0; i < n; i++) {
    const x = (hash(seed + i) * 2 - 1) * rx, y = (hash(seed + i * 5) * 2 - 1) * ry, r = rmin + hash(seed + i * 9) * (rmax - rmin);
    el('circle', { cx: fmt(x), cy: fmt(y), r: fmt(r + 9), fill: INK }, back);
    el('circle', { cx: fmt(x), cy: fmt(y), r: fmt(r), fill: '#8EE07A' }, front);
    el('circle', { cx: fmt(x - r * .3), cy: fmt(y - r * .3), r: fmt(r * .25), fill: '#C8F5B8' }, front);
  }
  return g;
}
const V = new URLSearchParams(location.search).get('v') || 'a';

// ====== Miniature (couverture TikTok) : une seule image, t = 0,9 s =======================
S(0, M.DUR, (cam) => {
  if (V === 'a') {
    // A : fond rouge, « FERMER L'ABATTANT », nuage toxique qui sort quand même, tampon « INUTILE ? »
    bg(cam, RED, false);
    const head = title(cam, [['FERMER', CREAM], ["L'ABATTANT", YELLOW]], { size: 128, shadow: 0, sw: 16 });
    const fl = floor(cam, 330, 1000, 0);
    const wc = toilet(cam); wc.setLid(1);
    const cl = toxic(cam, 16, 7, 170, 120, 45, 85);
    const vs = viruses(cam, 6, 11, 150, 100, .75);
    const st = stamp(cam, 'INUTILE ?', INK, 105);
    const s = 1, ox = CX - 60, oy = 930;
    return t => {
      at(head, CX - 50, 330, 1, -4);
      at(wc.g, ox, oy, s); at(fl, 0, oy + 310 * s + 4, 1);
      at(cl, ox + 300, oy - 230, 1);
      vs.forEach(v => at(v.g, ox + 300 + v.x, oy - 230 + v.y, 1, v.ph * 30));
      st.update(CX + 170, 1500, t, 0, -8);
    };
  }
  if (V === 'b') {
    // B : avant / après. Ce que tu crois (abattant fermé, protégé) vs la réalité (les virus sortent).
    bg(cam);
    const head = title(cam, ['ABATTANT', ['FERMÉ', BLUE], '= PROTÉGÉ ?'], { size: 100, shadow: 0, sw: 13 });
    const L = toilet(cam), R = toilet(cam); L.setLid(1); R.setLid(1);
    const cL = chip(cam, 'CE QUE TU CROIS', GREEN, CREAM, 38), cR = chip(cam, 'LA RÉALITÉ', RED, CREAM, 44);
    const ok = el('g', {}, cam), okS = bigNum(ok, 170, GREEN); okS.set('✓');
    const cl = toxic(cam, 12, 21, 110, 90, 35, 65);
    const vs = viruses(cam, 5, 31, 100, 70, .6);
    const lab = title(cam, ['LES VIRUS', ['PASSENT', RED], 'QUAND MÊME'], { size: 72, shadow: 0, sw: 10 });
    const sep = el('line', { x1: 0, y1: 0, x2: 0, y2: 640, stroke: INK, 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-dasharray': '30 26' }, cam);
    return t => {
      at(head, CX - 20, 320, 1, -3);
      at(sep, 520, 560, 1);
      cL.update(270, 600, 1, -3); cR.update(760, 600, 1, 3);
      at(L.g, 300, 1040, .62); at(R.g, 770, 1040, .62);
      at(lab, 640, 1480, 1, -3);
      at(ok, 290, 760, 1, 0);
      at(cl, 800, 790, 1);
      vs.forEach(v => at(v.g, 800 + v.x, 790 + v.y, 1, v.ph * 30));
    };
  }
  // C : fond bleu nuit, le chiffre choc « 1,50 M EN 8 SECONDES », nuage qui monte du WC
  bg(cam, '#2C3E50', false);
  const big = el('g', {}, cam), bigS = bigNum(big, 250, YELLOW); bigS.set('1,50 M');
  const sub = title(cam, [['EN 8 SECONDES', CREAM]], { size: 84, shadow: 0, sw: 0 });
  const wc = toilet(cam); wc.setLid(0);
  const cl = toxic(cam, 22, 41, 150, 190, 40, 75);
  const vs = viruses(cam, 7, 51, 130, 170, .65);
  const st = stamp(cam, 'TU FERMES L\'ABATTANT ?', RED, 40);
  const s = .85, ox = CX + 60, oy = 1150;
  return t => {
    at(big, CX - 30, 310, 1, -4);
    at(sub, CX - 30, 470, 1, -4);
    at(wc.g, ox, oy, s);
    at(cl, ox + 30, oy - 300, 1);
    vs.forEach(v => at(v.g, ox + 30 + v.x, oy - 300 + v.y, 1, v.ph * 30));
    st.update(CX + 150, 1570, t, 0, -5);
  };
});
Motion.selene({ pos: t => ({ x: 165, y: 1660, k: 1 }) });
start();
})();
</script>
</body>
