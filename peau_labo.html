<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peau humaine fabriquée en labo</title>
</head>
<body>
<!-- Vidéo TikTok « Greffé avec la peau d'un mort ? Des Français ont fabriqué une peau qui pourrait la remplacer »
     (charte : docs/MODELE.md), avec Séléné en bas à gauche, ton curieux et plein d'espoir.
     Sujet du 21 novembre 2026, choisi par Benoit : projet GENESIS (Urgo, CNRS, Lyon 1, CECS/I-Stem, EFS, Dassault Systèmes).
     Voix-off : scripts/peau_labo.txt → node tools/voix.mjs peau_labo ; node tools/enveloppe.mjs peau_labo
     Chiffres et sources : en tête de scripts/peau_labo.txt. Tout est dessiné (pas de photo). -->
<script src="lib/motion.js"></script>
<script src="assets/peau_labo_words.js"></script>
<script src="assets/peau_labo_env.js"></script>
<script src="lib/selene.js"></script>
<script>
(async () => {
const { M, setup, start, S, Wt, captions, addShake, E, p, pop, lerp, clamp, fmt, el, set, show, tf, txt, title, card, chip, emoji, bg, burst, sparkles } = Motion;
await setup({
  duration: 104,
  words: window.WORDS,
  audio: 'assets/voix_peau_labo.mp3',
  emojis: '🔥🩹💀🧫🔬❄️🏥📦💶⏳🤔💬👇🇫🇷🛡️❤️✅❌🧬',
});
const { W, H, CX } = M, { GREEN, RED, CREAM, INK, WHITE } = M.C;
const YEL = '#FFD23F', ORA = '#F39C12', BLUE = '#3498DB', ICE = '#BFE6FF', GREY = '#B8B2A7';
const SKIN = '#F2C4A0', SKIN_D = '#D99A78', EPI = '#F7CDB8', DER = '#E59A8A', HYPO = '#F6DB8C', BURN = '#E74C3C';

// --- briques propres à cette vidéo ----------------------------------------------
const at = (g, x, y, s = 1, r = 0) => tf(g, x, y, s, r);
const hit = (t, t0, w = .3) => Math.max(0, 1 - Math.abs(t - t0) / w);
const shock = (t, t0, w = .3, k = .5) => addShake(hit(t, t0, w) * k);
function stamp(parent, str, color = RED, size = 100) {
  const g = el('g', {}, parent), inner = el('g', {}, g);
  const t = txt(inner, str, { size, fill: color });
  t.t.setAttribute('y', size * .36);
  const w = t.w + size * .9, h = size * 1.5;
  inner.insertBefore(el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 22, fill: CREAM, stroke: color, 'stroke-width': 14 }), t.g);
  inner.insertBefore(el('rect', { x: -w / 2 + 12, y: -h / 2 + 12, width: w, height: h, rx: 22, fill: INK }), inner.firstChild);
  return { g, update(x, y, t, t0, r = -6) { const k = clamp((t - t0) / .25); show(g, t >= t0); tf(g, x, y, 1, r); tf(inner, 0, 0, lerp(2.2, 1, E.out(k))); g.setAttribute('opacity', fmt(Math.min(1, k * 2))); } };
}
function bigNum(parent, size, fill = RED) {
  const t = el('text', { 'text-anchor': 'middle', 'font-size': size, y: size * .36, fill, stroke: INK, 'stroke-width': size * .09, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, parent);
  return { t, set(s) { t.textContent = s; } };
}
let CID = 0;
// Morceau de peau en coupe (épiderme, derme, hypoderme), centré, w × h.
function skin(parent, w = 340, h = 220, o = {}) {
  const g = el('g', {}, parent), id = 'sk' + (++CID);
  const cp = el('clipPath', { id }, M.defs); el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 26 }, cp);
  el('rect', { x: -w / 2 + 12, y: -h / 2 + 12, width: w, height: h, rx: 26, fill: INK }, g);
  const c = el('g', { 'clip-path': `url(#${id})` }, g);
  el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, fill: HYPO }, c);
  el('path', { d: `M${-w / 2},${-h * .02} ${Array.from({ length: 9 }, (_, i) => `Q${fmt(-w / 2 + w * (i + .5) / 9)},${fmt(h * (i % 2 ? .12 : -.1))} ${fmt(-w / 2 + w * (i + 1) / 9)},${fmt(h * .02)}`).join(' ')} L${w / 2},${-h / 2} L${-w / 2},${-h / 2} Z`, fill: DER, stroke: INK, 'stroke-width': 4 }, c);
  el('rect', { x: -w / 2, y: -h / 2, width: w, height: h * .2, fill: o.top || EPI, stroke: INK, 'stroke-width': 4 }, c);
  [[-.3, .3], [-.05, .35], [.25, .28], [.38, .4], [-.4, .42]].forEach(([x, y]) => el('circle', { cx: x * w, cy: y * h, r: h * .05, fill: '#F9E7B5', stroke: INK, 'stroke-width': 3 }, c));
  [-.28, .05, .32].forEach(x => el('path', { d: `M${x * w},${-h * .5} q${w * .03},${-h * .18} ${w * .01},${-h * .3}`, fill: 'none', stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round' }, g));
  el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 26, fill: 'none', stroke: INK, 'stroke-width': 8 }, g);
  return g;
}
// Silhouette de face (origine au centre du torse, ≈ 700 px de haut). burn(k) : brûlure qui monte des pieds (0 → 1).
function body(parent, o = {}) {
  const g = el('g', {}, parent), id = 'bd' + (++CID);
  const parts = [
    ['circle', { cx: 0, cy: -270, r: 72 }],
    ['rect', { x: -110, y: -190, width: 220, height: 280, rx: 60 }],
    ['rect', { x: -170, y: -180, width: 62, height: 270, rx: 31, transform: 'rotate(8,-139,-180)' }],
    ['rect', { x: 108, y: -180, width: 62, height: 270, rx: 31, transform: 'rotate(-8,139,-180)' }],
    ['rect', { x: -100, y: 60, width: 88, height: 330, rx: 40 }],
    ['rect', { x: 12, y: 60, width: 88, height: 330, rx: 40 }],
  ];
  const sh = el('g', { transform: 'translate(12,12)' }, g);
  parts.forEach(([t, a]) => el(t, { ...a, fill: INK }, sh));
  parts.forEach(([t, a]) => el(t, { ...a, fill: SKIN, stroke: INK, 'stroke-width': 7 }, g));
  const cp = el('clipPath', { id }, M.defs); const cr = el('rect', { x: -260, y: 400, width: 520, height: 0 }, cp);
  const bu = el('g', { 'clip-path': `url(#${id})` }, g);
  parts.forEach(([t, a]) => el(t, { ...a, fill: BURN, stroke: INK, 'stroke-width': 7 }, bu));
  // visage
  el('circle', { cx: -24, cy: -278, r: 8, fill: INK }, g); el('circle', { cx: 24, cy: -278, r: 8, fill: INK }, g);
  const mouth = el('path', { d: 'M-22,-240 Q0,-226 22,-240', fill: 'none', stroke: INK, 'stroke-width': 6, 'stroke-linecap': 'round' }, g);
  return {
    g,
    burn(k) { const top = 400 - 760 * k; set(cr, { y: fmt(top), height: fmt(400 - top) }); mouth.setAttribute('d', k > .3 ? 'M-22,-232 Q0,-248 22,-232' : 'M-22,-240 Q0,-226 22,-240'); },
  };
}
// Boîte de Petri vue de dessus, avec des cellules qui se multiplient (n de 0 à 1).
function petri(parent, r = 200) {
  const g = el('g', {}, parent);
  el('circle', { cx: 12, cy: 12, r, fill: INK }, g);
  el('circle', { r, fill: '#E8F6FF', stroke: INK, 'stroke-width': 8 }, g);
  el('circle', { r: r * .86, fill: '#FCE3D6', stroke: INK, 'stroke-width': 4, opacity: .9 }, g);
  const cells = [];
  for (let i = 0; i < 60; i++) {
    const a = i * 2.39996, d = r * .78 * Math.sqrt((i + .5) / 60);
    cells.push(el('circle', { cx: fmt(Math.cos(a) * d), cy: fmt(Math.sin(a) * d), r: r * .07, fill: DER, stroke: INK, 'stroke-width': 3 }, g));
  }
  el('path', { d: `M${-r * .55},${-r * .6} q${r * .2},${-r * .15} ${r * .45},${-r * .2}`, fill: 'none', stroke: WHITE, 'stroke-width': 10, 'stroke-linecap': 'round', opacity: .8 }, g);
  return { g, set(n) { cells.forEach((c, i) => show(c, i < Math.round(n * cells.length))); } };
}
// Calendrier qui tourne les semaines.
function calendar(parent) {
  const g = el('g', {}, parent);
  card(g, -170, -150, 340, 300, WHITE, 28, 12, 8);
  el('rect', { x: -170, y: -150, width: 340, height: 80, rx: 26, fill: RED, stroke: INK, 'stroke-width': 8 }, g);
  const h = txt(g, 'SEMAINE', { size: 40, fill: CREAM }); h.g.setAttribute('transform', 'translate(0,-96)');
  const n = el('text', { 'text-anchor': 'middle', 'font-size': 150, y: 100, fill: INK }, g);
  return { g, set(v) { n.textContent = String(v); } };
}
// Pansement (sans logo).
function plaster(parent) {
  const g = el('g', {}, parent);
  el('rect', { x: -210 + 12, y: -70 + 12, width: 420, height: 140, rx: 70, fill: INK }, g);
  el('rect', { x: -210, y: -70, width: 420, height: 140, rx: 70, fill: '#F4B183', stroke: INK, 'stroke-width': 8 }, g);
  el('rect', { x: -75, y: -55, width: 150, height: 110, rx: 18, fill: CREAM, stroke: INK, 'stroke-width': 5 }, g);
  [[-150, -20], [-130, 20], [-170, 10], [130, -20], [150, 20], [170, -5]].forEach(([x, y]) => el('circle', { cx: x, cy: y, r: 7, fill: SKIN_D }, g));
  return g;
}
// Tube à essai (banque de cellules).
function vial(parent, col = DER) {
  const g = el('g', {}, parent);
  el('rect', { x: -32 + 8, y: -120 + 8, width: 64, height: 240, rx: 32, fill: INK }, g);
  el('rect', { x: -32, y: -120, width: 64, height: 240, rx: 32, fill: WHITE, stroke: INK, 'stroke-width': 7 }, g);
  el('rect', { x: -26, y: 0, width: 52, height: 114, rx: 26, fill: col }, g);
  el('rect', { x: -40, y: -140, width: 80, height: 40, rx: 10, fill: BLUE, stroke: INK, 'stroke-width': 7 }, g);
  return g;
}
// Thermomètre (v de 0 à 1 : niveau).
function thermo(parent) {
  const g = el('g', {}, parent);
  el('rect', { x: -40 + 10, y: -300 + 10, width: 80, height: 520, rx: 40, fill: INK }, g);
  el('rect', { x: -40, y: -300, width: 80, height: 520, rx: 40, fill: WHITE, stroke: INK, 'stroke-width': 8 }, g);
  const bulb = el('circle', { cy: 240, r: 75, fill: BLUE, stroke: INK, 'stroke-width': 8 }, g);
  const lvl = el('rect', { x: -20, width: 40, rx: 20, fill: BLUE }, g);
  for (let i = 0; i < 8; i++) el('line', { x1: 40, x2: 62, y1: -250 + i * 60, y2: -250 + i * 60, stroke: INK, 'stroke-width': 6 }, g);
  return { g, set(v, col) { const top = lerp(-270, 180, 1 - v); set(lvl, { y: fmt(top), height: fmt(240 - top), fill: col }); bulb.setAttribute('fill', col); } };
}
// Carton « PEAU » pour l'étagère.
function box(parent, label = 'PEAU') {
  const g = el('g', {}, parent);
  card(g, -110, -80, 220, 160, ICE, 18, 10, 7);
  el('rect', { x: -110, y: -80, width: 220, height: 40, rx: 16, fill: BLUE, stroke: INK, 'stroke-width': 7 }, g);
  const t = txt(g, label, { size: 44 }); t.g.setAttribute('transform', 'translate(0,46)');
  const s = el('g', {}, g); emoji(s, '❄️', 40); s.setAttribute('transform', 'translate(70,-60)');
  return g;
}
// Petit drapeau français.
function flag(parent, w = 120) {
  const g = el('g', {}, parent), h = w * .66;
  el('rect', { x: -w / 2 + 8, y: -h / 2 + 8, width: w, height: h, rx: 10, fill: INK }, g);
  [BLUE, WHITE, RED].forEach((c, i) => el('rect', { x: -w / 2 + i * w / 3, y: -h / 2, width: w / 3, height: h, fill: c }, g));
  el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 10, fill: 'none', stroke: INK, 'stroke-width': 6 }, g);
  return g;
}

// --- débuts de scène, calés sur la voix ------------------------------------------
const T = {
  how: Wt('Mais') - .2, auto: Wt('Le') - .25, tout: Wt('quand') - .3, cult: Wt('Alors') - .2,
  don: Wt('attendant') - .45, hier: Wt('Hier') - .2, idee: Wt('Leur') - .2, froid: Wt('détail') - .55,
  stock: Wt('Imagine') - .2, cent: Wt('Ils', 1, Wt('Imagine')) - .2, att: Wt('attention') - .5,
  q: Wt('vraie') - .45, cta: Wt('toi', 1, Wt('Réponse')) - .45,
};
const tDis = Wt('Dis-le');

// ====== 1. ACCROCHE : si tu te brûles gravement… on peut te greffer… la peau d'un mort.
//        Des Français viennent de fabriquer une peau… qui pourrait la remplacer. (sujet à l'écran dès la 1re image)
S(0, T.how, (cam) => {
  const tMort = Wt('mort'), tFr = Wt('Français'), tFab = Wt('fabriquer'), tRem = Wt('remplacer');
  bg(cam);
  const head = title(cam, ['GREFFÉ AVEC', ['LA PEAU', RED], ["D'UN MORT ?", RED]], { size: 112, shadow: 0, sw: 13 });
  const sk = skin(cam, 380, 240);
  const skull = el('g', {}, cam); emoji(skull, '💀', 130);
  const fire = el('g', {}, cam); emoji(fire, '🔥', 130);
  const fr = flag(cam, 130);
  const h2 = title(cam, ['DES FRANÇAIS', ['ONT FABRIQUÉ', GREEN], ['UNE PEAU', GREEN]], { size: 100, shadow: 0, sw: 13 });
  const lab = chip(cam, 'EN LABORATOIRE', INK, CREAM, 50);
  const rem = chip(cam, 'QUI POURRAIT LA REMPLACER', GREEN, INK, 44);
  const sp = sparkles(cam, 8, 5, 215);
  return t => {
    const kB = p(t, tFr - .45, tFr - .15);
    at(head, CX, 360, lerp(1.08, 1, p(t, 0, .3, E.out)) * (1 - kB), -2);
    at(fire, CX + 270, 700, pop(t, -.3, .35) * (1 - kB) * (1 + .08 * Math.sin(t * 9)), Math.sin(t * 7) * 6);
    at(skull, CX - 260, 690, pop(t, tMort - .2, .4) * (1 - kB), -10);
    at(sk, CX, lerp(870, 905, p(t, tFr - .4, tFr)), pop(t, -.2, .35), -3);
    at(fr, CX, 215, pop(t, tFr - .2, .35), -6);
    at(h2, CX, 425, pop(t, tFr - .15, .35), -2);
    lab.update(CX, 690, pop(t, tFab - .1), 2);
    rem.update(CX, 1105, pop(t, tRem - .25), -2);
    sp.update(CX, 905, p(t, tFab, tFab + .3) , t);
    shock(t, tMort + .1, .3, .45);
  };
});

// ====== 2. MAIS D'ABORD… COMMENT ON SOIGNE UNE GROSSE BRÛLURE AUJOURD'HUI ? =======================
S(T.how, T.auto, (cam, a) => {
  const tCom = Wt('comment'), tBr = Wt('brûlure'), tAuj = Wt("aujourd'hui");
  bg(cam);
  const tag = chip(cam, "MAIS D'ABORD…", INK, CREAM, 50);
  const head = title(cam, ['COMMENT', 'ON SOIGNE', ['UNE GROSSE', RED], ['BRÛLURE ?', RED]], { size: 108, shadow: 0, sw: 13 });
  const fire = el('g', {}, cam); emoji(fire, '🔥', 170);
  const auj = chip(cam, "AUJOURD'HUI", RED, CREAM, 52);
  return t => {
    tag.update(CX, 235, pop(t, a + .05), -2);
    at(head, CX, 560, pop(t, tCom - .25, .35), -2);
    at(fire, CX, 900, pop(t, tBr - .2, .4) * (1 + .07 * Math.sin(t * 9)), Math.sin(t * 7) * 6);
    auj.update(CX, 1070, pop(t, tAuj - .2), 3);
  };
}, { swipe: RED });

// ====== 3. AUTOGREFFE : on prend de la peau saine ailleurs (cuisse, dos) → une deuxième plaie =========
S(T.auto, T.tout, (cam, a) => {
  const tSai = Wt('saine'), tCui = Wt('cuisse'), tPos = Wt('posent'), tRep = Wt('réparer'), tDeu = Wt('deuxième');
  bg(cam);
  const tag = chip(cam, "L'AUTOGREFFE", INK, CREAM, 50);
  const bd = body(cam);
  const burnArm = el('ellipse', { rx: 34, ry: 62, fill: BURN, stroke: INK, 'stroke-width': 6 }, cam);
  const take = el('rect', { x: -40, y: -60, width: 80, height: 120, rx: 14, fill: 'none', stroke: INK, 'stroke-width': 7, 'stroke-dasharray': '16 10' }, cam);
  const wound = el('rect', { x: -38, y: -58, width: 76, height: 116, rx: 14, fill: '#C0392B' }, cam);
  const patch = skin(cam, 90, 120);
  const arrow = el('path', { d: '', fill: 'none', stroke: INK, 'stroke-width': 12, 'stroke-linecap': 'round', 'stroke-dasharray': '22 14' }, cam);
  const sai = chip(cam, 'PEAU SAINE', GREEN, INK, 44);
  const cui = chip(cam, 'CUISSE, DOS…', INK, CREAM, 42);
  const st = stamp(cam, '2 PLAIES', RED, 90);
  const bx = CX + 40, by = 640;
  return t => {
    tag.update(CX, 235, pop(t, a + .05), -2);
    at(bd.g, bx, by, .92 * pop(t, a + .1, .4)); bd.burn(0);
    at(burnArm, bx + 150, by - 40, pop(t, a + .3, .35), 8);
    // zone prélevée sur la cuisse gauche
    const tx = bx - 52, ty = by + 250;
    const kT = p(t, tPos - .2, tPos + .6, E.inOut);
    at(take, tx, ty, pop(t, tCui - .3, .3), 0);
    show(wound, t >= tPos - .2); at(wound, tx, ty, 1, 0);
    at(patch, lerp(tx, bx + 150, kT), lerp(ty, by - 40, kT), pop(t, tSai - .2, .35) * lerp(1, .9, kT), lerp(0, 8, kT));
    set(arrow, { d: `M${tx + 50},${ty - 40} Q${bx + 260},${by + 200} ${bx + 175},${by + 40}` }); show(arrow, t >= tSai && t < tPos + .6);
    sai.update(240, ty - 120, pop(t, tSai - .2) * (1 - p(t, tRep - .3, tRep)), -4);
    cui.update(230, ty + 110, pop(t, tCui - .2) * (1 - p(t, tRep - .3, tRep)), 3);
    st.update(CX, 1080, t, tDeu - .2, -5);
    shock(t, tDeu + .1, .3, .45);
  };
}, { swipe: GREEN });

// ====== 4. ET QUAND PRESQUE TOUT LE CORPS EST BRÛLÉ ? Plus assez de peau à prendre ===============
S(T.tout, T.cult, (cam, a) => {
  const tBr = Wt('brûlé'), tAss = Wt('assez'), tPr = Wt('prendre');
  bg(cam);
  const head = title(cam, ['PRESQUE TOUT', ['LE CORPS BRÛLÉ ?', RED]], { size: 92, shadow: 0, sw: 12 });
  const bd = body(cam);
  const st = stamp(cam, 'PLUS ASSEZ DE PEAU', RED, 62);
  return t => {
    at(head, CX, 260, pop(t, a + .05, .35), -2);
    at(bd.g, CX, 680, .85 * pop(t, a + .05, .35));
    bd.burn(.9 * p(t, a + .2, tBr + .3, E.inOut));
    st.update(CX, 1080, t, tAss - .2, -5);
    shock(t, tAss, .3, .45);
  };
}, { swipe: RED });

// ====== 5. CULTURE : faire pousser ta propre peau en labo (depuis les années 80)… mais des semaines =====
S(T.cult, T.don, (cam, a) => {
  const tPou = Wt('pousser'), tCel = Wt('cellules'), t80 = Wt('80.'), tSem = Wt('semaines'), tGr = Wt('grand'), tPas = Wt('pas', 1, tGr);
  bg(cam);
  const tag = chip(cam, 'SOLUTION 2', INK, CREAM, 50);
  const head = title(cam, ['FAIRE POUSSER', ['TA PROPRE PEAU', GREEN]], { size: 88, shadow: 0, sw: 12 });
  const pe = petri(cam, 210);
  const y80 = chip(cam, 'DEPUIS LES ANNÉES 80', INK, CREAM, 44);
  const cal = calendar(cam);
  const st = stamp(cam, 'PAS LE TEMPS', RED, 84);
  return t => {
    tag.update(CX, 235, pop(t, a + .05), -2);
    at(head, CX, 400, pop(t, tPou - .3, .35), -1);
    const kC = p(t, tSem - .4, tSem - .1);
    pe.set(p(t, tCel - .3, t80 + .6));
    at(pe.g, lerp(CX, CX - 210, kC), 740, pop(t, tPou - .1, .4) * lerp(1, .8, kC), t * 4);
    y80.update(CX, 1010, pop(t, t80 - .3) * (1 - p(t, tGr - .3, tGr)), 2);
    cal.set(1 + Math.floor(5 * p(t, tSem - .1, tGr)));
    at(cal.g, CX + 220, 740, pop(t, tSem - .2, .35) * .85, 4);
    st.update(CX, 1040, t, tPas - .1, -5);
    shock(t, tPas + .1, .3, .45);
  };
}, { swipe: GREEN });

// ====== 6. EN ATTENDANT : peau de donneurs décédés (ça protège)… rejetée au bout de quelques semaines =====
S(T.don, T.hier, (cam, a) => {
  const tDon = Wt('donneurs'), tPro = Wt('protège'), tRej = Wt('rejeter'), tQq = Wt('quelques', 1, tRej);
  bg(cam);
  const tag = chip(cam, 'EN ATTENDANT', INK, CREAM, 50);
  const head = title(cam, ['LA PEAU DE', ['DONNEURS DÉCÉDÉS', RED]], { size: 82, shadow: 0, sw: 12 });
  const bk = el('g', {}, cam);
  card(bk, -230, -130, 460, 260, ICE, 30, 12, 8);
  el('rect', { x: -230, y: -130, width: 460, height: 70, rx: 28, fill: BLUE, stroke: INK, 'stroke-width': 8 }, bk);
  const bt = txt(bk, 'BANQUE DE TISSUS', { size: 36, fill: CREAM }); bt.g.setAttribute('transform', 'translate(0,-82)');
  const s1 = skin(bk, 300, 140); s1.setAttribute('transform', 'translate(0,30)');
  const shield = el('g', {}, cam); emoji(shield, '🛡️', 120);
  const pro = chip(cam, 'ÇA PROTÈGE', GREEN, INK, 48);
  const st = stamp(cam, 'REJETÉE', RED, 100);
