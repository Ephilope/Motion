<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le réchauffement climatique</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b1c; overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; }
  text { font-family: Inter, "DejaVu Sans", sans-serif; }
  #ui { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center;
        background: rgba(7, 11, 28, .7); padding: 8px 14px; border-radius: 999px; font: 14px Inter, sans-serif; color: #fff; }
  #ui button { background: #ffb547; border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; cursor: pointer; }
  #ui input { width: min(50vw, 480px); }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="wrap"><svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="ui"><button id="play">Pause</button><input id="seek" type="range" min="0" max="61" step="0.01" value="0"><span id="time">0.0s</span></div>
<script>
// ---------------------------------------------------------------------------
// Moteur : tout est une fonction pure du temps -> renderAt(t) (rendu image par image)
// ---------------------------------------------------------------------------
const NS = 'http://www.w3.org/2000/svg';
const W = 1920, H = 1080, DUR = 61;
const svg = document.getElementById('stage');
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function set(e, attrs) { for (const k in attrs) e.setAttribute(k, attrs[k]); }
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  lin: t => t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI / 3)) + 1,
};
const p = (t, a, b, ease = E.inOut) => ease(clamp((t - a) / (b - a)));
const rad = d => d * Math.PI / 180;
function rng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function blink(t, off = 0, period = 3.4) { const ph = (t + off) % period; return ph < .2 ? Math.sin(ph / .2 * Math.PI) : 0; }
const fmt = n => n.toFixed(1);

function smoothClosed(pts) {
  const n = pts.length; let d = `M${fmt(pts[0][0])},${fmt(pts[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    d += `C${fmt(p1[0] + (p2[0] - p0[0]) / 6)},${fmt(p1[1] + (p2[1] - p0[1]) / 6)} ${fmt(p2[0] - (p3[0] - p1[0]) / 6)},${fmt(p2[1] - (p3[1] - p1[1]) / 6)} ${fmt(p2[0])},${fmt(p2[1])}`;
  }
  return d + 'Z';
}
function blobPath(cx, cy, r, seed, n = 8, jit = .45) {
  const R = rng(seed), pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, rr = r * (1 - jit / 2 + R() * jit);
    pts.push([cx + Math.cos(a) * rr * 1.25, cy + Math.sin(a) * rr * .85]);
  }
  return smoothClosed(pts);
}
function wavy(p0, p1, amp, wl) {
  const dx = p1[0] - p0[0], dy = p1[1] - p0[1], len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len, n = Math.ceil(len / 8);
  let d = '';
  for (let i = 0; i <= n; i++) {
    const s = i / n, w = Math.sin(s * len / wl * Math.PI * 2) * amp * Math.sin(Math.PI * Math.min(1, s * 6)) ;
    d += (i ? 'L' : 'M') + fmt(p0[0] + dx * s - uy * w) + ',' + fmt(p0[1] + dy * s + ux * w);
  }
  return d;
}

// ---------------------------------------------------------------------------
// Dégradés
// ---------------------------------------------------------------------------
const defs = el('defs', {}, svg);
function lg(id, stops, x2 = 0, y2 = 1) { const g = el('linearGradient', { id, x1: 0, y1: 0, x2, y2 }, defs); stops.forEach(([o, c, op = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': op }, g)); }
function rg(id, stops, cx = .5, cy = .5, r = .5) { const g = el('radialGradient', { id, cx, cy, r }, defs); stops.forEach(([o, c, op = 1]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': op }, g)); }
rg('gSpace', [[0, '#22306e'], [1, '#090e26']], .45, .45, .8);
rg('gOcean', [[0, '#7fd0ff'], [.55, '#2f86e6'], [1, '#1b4aa8']], .35, .3, .8);
rg('gShade', [[0, '#ffffff', .28], [.45, '#ffffff', 0], [1, '#0a1748', .5]], .35, .3, .8);
rg('gEarthGlow', [[.6, '#7fd3ff', .45], [1, '#7fd3ff', 0]]);
rg('gSun', [[0, '#fff6c2'], [.6, '#ffd23f'], [1, '#ff9f2b']], .4, .35, .7);
rg('gSunGlow', [[.35, '#ffd23f', .55], [1, '#ffb347', 0]]);
rg('gAtmo', [[.62, '#7fd3ff', 0], [.82, '#7fd3ff', .22], [1, '#7fd3ff', 0]]);
rg('gAtmoHot', [[.62, '#ff9a5c', 0], [.82, '#ff7a45', .45], [1, '#ff7a45', 0]]);
lg('gSkyCity', [[0, '#73bfff'], [1, '#d9f0ff']]);
lg('gSmog', [[0, '#5d4f45', .95], [.7, '#8a7d70', .35], [1, '#8a7d70', 0]]);
lg('gSkyArctic', [[0, '#ff9f7a'], [.6, '#ffd2a8'], [1, '#fff0de']]);
lg('gSea', [[0, '#3aa0ff'], [1, '#123f8f']]);
lg('gWarm', [[0, '#ff9a5c'], [1, '#ff4f6d']], 1, 1);
lg('gSkySol', [[0, '#55c1ff'], [1, '#dcf7ff']]);
rg('gOutro', [[0, '#2fc1a7'], [1, '#0b4566']], .5, .45, .8);
lg('gPanel', [[0, '#2f5bb7'], [1, '#1b3576']], 1, 1);

// ---------------------------------------------------------------------------
// Personnages
// ---------------------------------------------------------------------------
let uid = 0;

// --- La Terre ---------------------------------------------------------------
function makeEarth(parent) {
  const id = uid++;
  const g = el('g', {}, parent);
  const glow = el('circle', { r: 300, fill: 'url(#gEarthGlow)' }, g);
  const arms = [el('g', {}, g), el('g', {}, g)];
  for (const a of arms) {
    el('path', { d: 'M0,0 C35,-5 70,-30 95,-65', fill: 'none', stroke: '#1d4f9e', 'stroke-width': 20, 'stroke-linecap': 'round' }, a);
    el('circle', { cx: 95, cy: -65, r: 27, fill: '#fff', stroke: '#c9d6ef', 'stroke-width': 5 }, a);
  }
  const clip = el('clipPath', { id: 'ec' + id }, defs); el('circle', { r: 200 }, clip);
  el('circle', { r: 200, fill: 'url(#gOcean)' }, g);
  const clipped = el('g', { 'clip-path': `url(#ec${id})` }, g);
  const land = el('g', {}, clipped);
  const shapes = [[-280, -60, 70, 3], [-120, 40, 85, 7], [40, -95, 62, 11], [165, 60, 75, 13], [300, -25, 80, 17], [430, 110, 45, 19], [-20, 155, 40, 23], [235, -150, 45, 29], [520, -90, 55, 31]];
  for (const k of [0, 800]) {
    const gg = el('g', { transform: `translate(${k},0)` }, land);
    for (const s of shapes) {
      el('path', { d: blobPath(s[0], s[1], s[2], s[3]), fill: '#5fd38d' }, gg);
      el('path', { d: blobPath(s[0] + 10, s[1] + 12, s[2] * .5, s[3] + 1), fill: '#3fb874', opacity: .75 }, gg);
    }
  }
  const capN = el('ellipse', { cx: 0, cy: -205, rx: 150, ry: 55, fill: '#f2fbff' }, clipped);
  const capS = el('ellipse', { cx: 0, cy: 210, rx: 125, ry: 45, fill: '#f2fbff' }, clipped);
  el('circle', { r: 200, fill: 'url(#gShade)' }, g);
  const heat = el('circle', { r: 200, fill: '#ff6a1f', opacity: 0 }, g);
  el('circle', { r: 200, fill: 'none', stroke: '#0f2b66', 'stroke-width': 6, opacity: .3 }, g);
  // visage
  const face = el('g', {}, g);
  const cheeks = [-1, 1].map(sx => el('ellipse', { cx: sx * 112, cy: 38, rx: 30, ry: 18, fill: '#ff8fa3', opacity: .6 }, face));
  const eyes = [-1, 1].map(sx => {
    const eg = el('g', { transform: `translate(${sx * 64},-25)` }, face);
    const lid = el('g', {}, eg);
    el('ellipse', { rx: 31, ry: 37, fill: '#fff' }, lid);
    const pupil = el('g', {}, lid);
    el('circle', { r: 18, fill: '#16213e' }, pupil);
    el('circle', { cx: 6, cy: -7, r: 6.5, fill: '#fff' }, pupil);
    const brow = el('path', { d: 'M-26,0 Q0,-10 26,0', stroke: '#0f2b66', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' }, eg);
    return { lid, pupil, brow, sx };
  });
  const mouth = el('path', { fill: '#7a1f33', stroke: '#0f2b66', 'stroke-width': 8, 'stroke-linejoin': 'round' }, face);
  const drops = [[-150, -95], [158, -70], [-95, -150]].map(([x, y]) => {
    const d = el('g', {}, g);
    el('path', { d: 'M0,-20 C11,-3 13,6 0,13 C-13,6 -11,-3 0,-20Z', fill: '#a8e8ff', stroke: '#2f86e6', 'stroke-width': 3 }, d);
    return { d, x, y };
  });
  return {
    g,
    update(o) {
      const t = o.t || 0;
      set(g, { transform: `translate(${o.x},${o.y}) rotate(${o.rot || 0}) scale(${o.s ?? 1})` });
      land.setAttribute('transform', `translate(${-((((o.spin || 0) % 800) + 800) % 800)},0)`);
      const ht = o.heat || 0;
      heat.setAttribute('opacity', ht * .45);
      glow.setAttribute('opacity', 1 - ht * .5);
      const ice = o.ice ?? 1;
      set(capN, { rx: 150 * ice, ry: 55 * ice }); set(capS, { rx: 125 * ice, ry: 45 * ice });
      const m = o.mood ?? 1, op = o.open ?? .2, bl = o.blink || 0;
      const look = o.look || [0, 0];
      for (const e of eyes) {
        e.lid.setAttribute('transform', `scale(1,${1 - bl * .92})`);
        e.pupil.setAttribute('transform', `translate(${look[0]},${look[1]})`);
        const raise = m < 0 ? -m * 10 : 0;
        e.brow.setAttribute('transform', `translate(0,${-52 - raise - Math.max(m, 0) * 4}) rotate(${m < 0 ? -e.sx * m * 18 : e.sx * m * 6})`);
      }
      const y0 = 60, w = 52 - op * 8, c1 = y0 + m * 30, c2 = y0 + m * 30 + op * 55 + (m > 0 ? m * 8 : 0);
      mouth.setAttribute('d', `M${-w},${y0} Q0,${c1} ${w},${y0} Q0,${c2} ${-w},${y0}Z`);
      cheeks.forEach(c => c.setAttribute('opacity', .45 + ht * .5));
      set(arms[0], { transform: `translate(-182,45) scale(-1,1) rotate(${o.armL ?? 70})` });
      set(arms[1], { transform: `translate(182,45) rotate(${o.armR ?? 70})` });
      drops.forEach((d, i) => {
        const ph = (t * .9 + i * .37) % 1;
        const vis = clamp((ht - .35) * 3);
        set(d.d, { transform: `translate(${d.x + (d.x > 0 ? 1 : -1) * ph * 10},${d.y + ph * 70}) scale(${.8 + ph * .3})`, opacity: vis * Math.sin(ph * Math.PI) });
      });
    }
  };
}

// --- Le Soleil (à lunettes) -------------------------------------------------
function makeSun(parent) {
  const g = el('g', {}, parent);
  el('circle', { r: 280, fill: 'url(#gSunGlow)' }, g);
  const rays = el('g', {}, g);
  for (let i = 0; i < 12; i++)
    el('path', { d: 'M-18,-150 L0,-205 L18,-150Z', fill: '#ffc93c', stroke: '#ffc93c', 'stroke-width': 12, 'stroke-linejoin': 'round', transform: `rotate(${i * 30})` }, rays);
  el('circle', { r: 128, fill: 'url(#gSun)' }, g);
  [-1, 1].forEach(sx => el('ellipse', { cx: sx * 78, cy: 32, rx: 22, ry: 13, fill: '#ff7b54', opacity: .5 }, g));
  const gl = el('g', {}, g);
  el('rect', { x: -100, y: -45, width: 84, height: 54, rx: 22, fill: '#1b1b2f' }, gl);
  el('rect', { x: 16, y: -45, width: 84, height: 54, rx: 22, fill: '#1b1b2f' }, gl);
  el('path', { d: 'M-18,-30 Q0,-40 18,-30', stroke: '#1b1b2f', 'stroke-width': 8, fill: 'none' }, gl);
  el('path', { d: 'M-80,-32 L-62,-32 M64,-32 L84,-32', stroke: '#fff', 'stroke-width': 7, 'stroke-linecap': 'round', opacity: .7 }, gl);
  const mouth = el('path', { d: 'M-42,42 Q0,85 42,42', stroke: '#a8441a', 'stroke-width': 10, fill: 'none', 'stroke-linecap': 'round' }, g);
  return {
    g,
    update(o) {
      const t = o.t || 0;
      set(g, { transform: `translate(${o.x},${o.y}) scale(${o.s ?? 1})` });
      set(rays, { transform: `rotate(${t * 18}) scale(${1 + .05 * Math.sin(t * 3)})` });
      const m = o.mood ?? 1;
      mouth.setAttribute('d', `M-42,48 Q0,${48 + m * 40} 42,48`);
      gl.setAttribute('transform', `translate(0,${Math.sin(t * 2.2) * 3})`);
    }
  };
}

// --- Molécule de CO2 (petit méchant) ---------------------------------------
function makeCO2(parent) {
  const g = el('g', {}, parent);
  const inner = el('g', {}, g);
  el('circle', { cx: -33, r: 21, fill: '#ff6b6b' }, inner);
  el('circle', { cx: 33, r: 21, fill: '#ff6b6b' }, inner);
  el('circle', { r: 28, fill: '#3d405b' }, inner);
  [-1, 1].forEach(sx => {
    el('circle', { cx: sx * 10, cy: -2, r: 7.5, fill: '#fff' }, inner);
    el('circle', { cx: sx * 10 + 1.5, cy: -1, r: 3.6, fill: '#1b1b2f' }, inner);
    el('path', { d: `M${sx * 18},-15 L${sx * 4},-9`, stroke: '#fff', 'stroke-width': 4, 'stroke-linecap': 'round' }, inner);
  });
  el('path', { d: 'M-7,13 Q0,8 7,13', stroke: '#fff', 'stroke-width': 3.5, fill: 'none', 'stroke-linecap': 'round' }, inner);
  return {
    g,
    update(x, y, s, rot = 0) {
      if (s <= .001) { g.setAttribute('display', 'none'); return; }
      g.removeAttribute('display');
      set(g, { transform: `translate(${fmt(x)},${fmt(y)}) rotate(${fmt(rot)}) scale(${s.toFixed(3)})` });
    }
  };
}

// --- Humain (bonhomme flat design) -----------------------------------------
function makePerson(parent, c) {
  const g = el('g', {}, parent);
  const inner = el('g', {}, g);
  const leg = (col) => { const lg_ = el('g', {}, inner); el('line', { x1: 0, y1: 0, x2: 0, y2: 98, stroke: col, 'stroke-width': 24, 'stroke-linecap': 'round' }, lg_); el('ellipse', { cx: 12, cy: 108, rx: 23, ry: 11, fill: '#2b2d42' }, lg_); return lg_; };
  const arm = (col) => {
    const sh = el('g', {}, inner);
    el('line', { x1: 0, y1: 0, x2: 0, y2: 46, stroke: col, 'stroke-width': 21, 'stroke-linecap': 'round' }, sh);
    const fo = el('g', {}, sh);
    el('line', { x1: 0, y1: 0, x2: 0, y2: 40, stroke: c.skin, 'stroke-width': 17, 'stroke-linecap': 'round' }, fo);
    el('circle', { cy: 46, r: 12, fill: c.skin }, fo);
    return { sh, fo };
  };
  const legB = leg(c.pantsDark), armB = arm(c.shirtDark);
  el('rect', { x: -35, y: -208, width: 70, height: 115, rx: 30, fill: c.shirt }, inner);
  const legF = leg(c.pants);
  const head = el('g', {}, inner);
  el('rect', { x: -10, y: 18, width: 20, height: 22, fill: c.skin }, head);
  if (c.hair === 'long') el('path', { d: 'M-46,-10 C-50,-60 50,-60 46,-10 L50,48 Q0,60 -50,48Z', fill: c.hairCol }, head);
  el('circle', { r: 43, fill: c.skin }, head);
  if (c.hair === 'bun') el('circle', { cx: -6, cy: -50, r: 20, fill: c.hairCol }, head);
  el('path', { d: 'M-45,-2 C-50,-60 50,-62 46,-6 C30,-30 -5,-34 -45,-2Z', fill: c.hairCol }, head);
  el('ellipse', { cx: 28, cy: 16, rx: 9, ry: 6, fill: '#ff8fa3', opacity: .6 }, head);
  const eyeG = el('g', {}, head);
  el('circle', { cx: 4, cy: 0, r: 5.5, fill: '#1b1b2f' }, eyeG);
  el('circle', { cx: 26, cy: 0, r: 5.5, fill: '#1b1b2f' }, eyeG);
  const mouth = el('path', { stroke: '#1b1b2f', 'stroke-width': 4.5, fill: 'none', 'stroke-linecap': 'round' }, head);
  const armF = arm(c.shirt);
  return {
    g,
    update(o) {
      const t = o.t || 0, w = o.walk;
      let lf = o.legF ?? 0, lb = o.legB ?? 0, af = o.armF ?? [-8, -10], ab = o.armB ?? [8, -10], bob = 0;
      if (w !== undefined) {
        const s = Math.sin(w); lf = 26 * s; lb = -26 * s;
        af = [-24 * s, -18]; ab = [24 * s, -18]; bob = -Math.abs(Math.cos(w)) * 7;
      }
      set(g, { transform: `translate(${fmt(o.x)},${fmt(o.y + bob)}) scale(${o.s ?? 1})` });
      inner.setAttribute('transform', o.flip ? 'scale(-1,1)' : '');
      legF.setAttribute('transform', `translate(6,-105) rotate(${lf})`);
      legB.setAttribute('transform', `translate(-6,-105) rotate(${lb})`);
      set(armF.sh, { transform: `translate(4,-185) rotate(${af[0]})` }); set(armF.fo, { transform: `translate(0,46) rotate(${af[1]})` });
      set(armB.sh, { transform: `translate(-4,-185) rotate(${ab[0]})` }); set(armB.fo, { transform: `translate(0,46) rotate(${ab[1]})` });
      head.setAttribute('transform', `translate(4,-250) rotate(${o.headRot || 0})`);
      eyeG.setAttribute('transform', `scale(1,${1 - (o.blink || 0) * .9})`);
      const m = o.mood ?? 1;
      mouth.setAttribute('d', `M4,${20 - m * 2} Q15,${20 + m * 9} 26,${20 - m * 2}`);
    }
  };
}

// --- Cycliste --------------------------------------------------------------
function makeCyclist(parent, c) {
  const g = el('g', {}, parent);
  const legBack = el('path', { stroke: c.pantsDark, 'stroke-width': 22, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const shoeB = el('ellipse', { rx: 18, ry: 9, fill: '#2b2d42' }, g);
  const spokes = [-100, 100].map(x => {
    const w = el('g', { transform: `translate(${x},0)` }, g);
    el('circle', { r: 56, fill: 'none', stroke: '#2b2d42', 'stroke-width': 11 }, w);
    const sp = el('g', {}, w);
    for (let i = 0; i < 6; i++) el('line', { x1: 0, y1: 0, x2: 0, y2: -50, stroke: '#8d99ae', 'stroke-width': 3, transform: `rotate(${i * 60})` }, sp);
    el('circle', { r: 8, fill: '#2b2d42' }, w);
    return sp;
  });
  el('path', { d: 'M-100,0 L0,0 L-32,-88 Z M0,0 L72,-96 L100,0 M-32,-88 L72,-96', stroke: c.bike, 'stroke-width': 10, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
  el('path', { d: 'M-58,-98 L-14,-98', stroke: '#2b2d42', 'stroke-width': 12, 'stroke-linecap': 'round' }, g);
  el('path', { d: 'M72,-96 L80,-118 L104,-116', stroke: '#2b2d42', 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const crank = el('line', { x1: 0, y1: 0, stroke: '#2b2d42', 'stroke-width': 8, 'stroke-linecap': 'round' }, g);
  el('line', { x1: -32, y1: -112, x2: 22, y2: -196, stroke: c.shirt, 'stroke-width': 48, 'stroke-linecap': 'round' }, g);
  const head = el('g', { transform: 'translate(44,-246)' }, g);
  el('circle', { r: 40, fill: c.skin }, head);
  el('path', { d: 'M-46,-4 C-48,-62 48,-64 48,-6 Z', fill: c.helmet }, head);
  el('path', { d: 'M-46,-4 L52,-4', stroke: c.helmet, 'stroke-width': 8, 'stroke-linecap': 'round' }, head);
  el('circle', { cx: 18, cy: 8, r: 5.5, fill: '#1b1b2f' }, head);
  el('path', { d: 'M12,24 Q22,32 32,22', stroke: '#1b1b2f', 'stroke-width': 4.5, fill: 'none', 'stroke-linecap': 'round' }, head);
  el('ellipse', { cx: 34, cy: 20, rx: 8, ry: 5, fill: '#ff8fa3', opacity: .6 }, head);
  el('path', { d: 'M22,-190 Q70,-170 100,-118', stroke: c.skin, 'stroke-width': 16, fill: 'none', 'stroke-linecap': 'round' }, g);
  el('path', { d: 'M22,-190 Q68,-175 96,-128', stroke: c.shirt, 'stroke-width': 19, fill: 'none', 'stroke-linecap': 'round', 'stroke-dasharray': '45 200' }, g);
  const legFront = el('path', { stroke: c.pants, 'stroke-width': 24, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const shoeF = el('ellipse', { rx: 19, ry: 10, fill: '#2b2d42' }, g);
  const HIP = [-32, -110], L = 76;
  function ik(F) {
    let dx = F[0] - HIP[0], dy = F[1] - HIP[1], d = Math.min(Math.hypot(dx, dy), 2 * L - 1);
    const base = Math.atan2(dy, dx), off = Math.acos(d / 2 / L);
    return [HIP[0] + L * Math.cos(base - off), HIP[1] + L * Math.sin(base - off)];
  }
  return {
    g,
    update(o) {
      set(g, { transform: `translate(${fmt(o.x)},${fmt(o.y)}) scale(${o.s ?? 1})` });
      const rot = o.dist / 56;
      spokes.forEach(sp => sp.setAttribute('transform', `rotate(${fmt(rot * 180 / Math.PI)})`));
      const a = rot * .8;
      const F1 = [30 * Math.cos(a), 30 * Math.sin(a)], F2 = [30 * Math.cos(a + Math.PI), 30 * Math.sin(a + Math.PI)];
      set(crank, { x1: fmt(F2[0]), y1: fmt(F2[1]), x2: fmt(F1[0]), y2: fmt(F1[1]) });
      const K1 = ik(F1), K2 = ik(F2);
      legFront.setAttribute('d', `M${HIP} L${K1.map(fmt)} L${F1.map(fmt)}`);
      legBack.setAttribute('d', `M${HIP} L${K2.map(fmt)} L${F2.map(fmt)}`);
      set(shoeF, { cx: fmt(F1[0] + 8), cy: fmt(F1[1] + 4) }); set(shoeB, { cx: fmt(F2[0] + 8), cy: fmt(F2[1] + 4) });
    }
  };
}

const BOUNDS = [7, 15, 26, 35, 46, 56];
const TCOL = [['#ffb547', '#ff6b6b'], ['#5fd38d', '#3aa0ff'], ['#ff6b6b', '#ffb547'], ['#3aa0ff', '#ffd23f'], ['#5fd38d', '#ffd23f'], ['#3aa0ff', '#5fd38d']];
const trLayer = el('g', {}, svg);
const c1 = el('circle', { cx: 960, cy: 540, r: 0 }, trLayer), c2 = el('circle', { cx: 960, cy: 540, r: 0 }, trLayer);
const fade = el('rect', { width: W, height: H, fill: '#000', opacity: 0 }, svg);

function renderAt(t) {
  t = clamp(t, 0, DUR - 1e-6);
  for (const s of scenes) {
    const vis = t >= s.a && t < s.b;
    s.root.setAttribute('display', vis ? '' : 'none');
    if (vis) s.upd(t);
  }
  for (const c of caps) {
    if (t < c.a || t > c.b) { c.g.setAttribute('display', 'none'); continue; }
    c.g.removeAttribute('display');
    const k = p(t, c.a, c.a + .45, E.back), out = p(t, c.b - .35, c.b, E.in);
    set(c.g, { transform: `translate(960,${fmt(990 + (1 - k) * 50 + out * 30)}) scale(${(.85 + .15 * k).toFixed(3)})`, opacity: (Math.min(p(t, c.a, c.a + .2), 1 - out)).toFixed(3) });
    c.words.forEach((w, i) => w.setAttribute('opacity', p(t, c.a + .1 + i * .055, c.a + .3 + i * .055).toFixed(3)));
  }
  let r1 = 0, r2 = 0, col = TCOL[0];
  BOUNDS.forEach((b, i) => {
    const d = t - b;
    if (Math.abs(d) < .55) {
      col = TCOL[i];
      r1 = d < 0 ? E.in(clamp((d + .5) / .45)) : 1 - E.out(clamp((d - .08) / .45));
      r2 = d < 0 ? E.in(clamp((d + .36) / .34)) : 1 - E.out(clamp(d / .4));
    }
  });
  set(c1, { r: fmt(r1 * 1150), fill: col[0] }); set(c2, { r: fmt(r2 * 1150), fill: col[1] });
  fade.setAttribute('opacity', p(t, 60.2, 61).toFixed(3));
}
window.renderAt = renderAt;
window.DURATION = DUR;
window.ready = true;

// ---------------------------------------------------------------------------
// Lecteur (aperçu navigateur)
// ---------------------------------------------------------------------------
if (!RENDER) {
  const btn = document.getElementById('play'), seek = document.getElementById('seek'), tl = document.getElementById('time');
  let playing = true, t0 = performance.now(), cur = 0;
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'Pause' : 'Lecture'; t0 = performance.now() - cur * 1000; };
  seek.oninput = () => { cur = +seek.value; t0 = performance.now() - cur * 1000; renderAt(cur); };
  (function loop(now) {
    if (playing) { cur = ((now - t0) / 1000) % DUR; seek.value = cur; renderAt(cur); tl.textContent = cur.toFixed(1) + 's'; }
    requestAnimationFrame(loop);
  })(performance.now());
} else renderAt(0);
</script>
</body>
</html>
