<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pourboire : qui a raison ?</title>
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 700; src: url(assets/fonts/montserrat-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url(assets/fonts/montserrat-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 900; src: url(assets/fonts/montserrat-latin-900-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { height: 100vh; width: 56.25vh; max-width: 100vw; max-height: 177.78vw; display: block; }
  text { font-family: Montserrat, 'Noto Color Emoji', sans-serif; font-weight: 900; }
  .mono { font-family: 'DejaVu Sans Mono', monospace; font-weight: 700; }
  .emoji { font-family: 'Noto Color Emoji', sans-serif; font-weight: 400; }
  #ui { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center;
        background: rgba(26, 26, 26, .8); padding: 8px 14px; border-radius: 999px; font: 14px sans-serif; color: #fff; }
  #ui button { background: #2ECC71; border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; cursor: pointer; }
  #ui input { width: min(40vw, 320px); }
  body.render #ui, body.render #safe { display: none; }
</style>
</head>
<body>
<div id="wrap"><svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="ui"><button id="play">Lecture</button><label><input id="safezone" type="checkbox"> zones TikTok</label><input id="seek" type="range" min="0" max="54" step="0.01" value="0"><span id="time">0.0s</span></div>
<audio id="voice" src="assets/voix_pourboire.mp3" preload="auto"></audio>
<script src="assets/pourboire_words.js"></script>
<script>
// ---------------------------------------------------------------------------
// Moteur : image = fonction pure du temps -> renderAt(t)
// ---------------------------------------------------------------------------
const NS = 'http://www.w3.org/2000/svg';
const W = 1080, H = 1920, DUR = 54;
const CX = 510;                       // centre utile (la marge droite de 120 px reste libre)
const GREEN = '#2ECC71', RED = '#E74C3C', CREAM = '#FFF4E0', INK = '#1A1A1A', WHITE = '#FFFFFF';
const svg = document.getElementById('stage');
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');

function el(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function set(e, attrs) { for (const k in attrs) e.setAttribute(k, attrs[k]); }
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  lin: t => t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  out5: t => 1 - Math.pow(1 - t, 5),
  in: t => t * t * t,
  back: t => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI / 3)) + 1,
};
const p = (t, a, b, ease = E.inOut) => ease(clamp((t - a) / (b - a)));
const pop = (t, t0, d = .35) => E.back(clamp((t - t0) / d));
const fmt = n => (+n).toFixed(1);
function rng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function mix(c1, c2, k) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, k));
  return '#' + ((1 << 24) + (ch(16) << 16) + (ch(8) << 8) + ch(0)).toString(16).slice(1);
}
function blink(t, off = 0, period = 3.1) { const ph = (t + off) % period; return ph < .18 ? Math.sin(ph / .18 * Math.PI) : 0; }
const show = (e, v) => e.setAttribute('display', v ? '' : 'none');
const tf = (e, x, y, s = 1, r = 0) => e.setAttribute('transform', `translate(${fmt(x)},${fmt(y)}) rotate(${fmt(r)}) scale(${Math.max(+s, .001).toFixed(3)})`);

(async () => {
await Promise.all(['700', '800', '900'].map(w => document.fonts.load(`${w} 80px Montserrat`)).concat([document.fonts.load('80px "Noto Color Emoji"', '😤👎👍💬👇')]));
// --- temps des mots de la voix-off (assets/pourboire_words.js) ---------------
const WORDS = window.WORDS;
const keyOf = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9%$]/g, '');
function Wt(word, n = 1, from = 0) {           // début du n-ième mot correspondant (après le temps `from`)
  const k = keyOf(word); let c = 0;
  for (const w of WORDS) if (w.t0 >= from && keyOf(w.w) === k && ++c === n) return w.t0;
  throw new Error('mot introuvable : ' + word);
}

// --- éléments graphiques communs --------------------------------------------
const defs = el('defs', {}, svg);
function txt(parent, str, o = {}) {
  const g = el('g', {}, parent);
  const a = { x: 0, y: 0, 'text-anchor': o.anchor || 'middle', 'font-size': o.size || 80, 'font-weight': o.weight || 900, fill: o.fill || INK, 'letter-spacing': o.ls ?? 0 };
  if (o.cls) a.class = o.cls;
  if (o.shadow) { const s = el('text', { ...a, x: o.shadow, y: o.shadow, fill: INK, stroke: INK, 'stroke-width': o.sw || 0, 'stroke-linejoin': 'round' }, g); s.textContent = str; }
  const m = el('text', { ...a, ...(o.sw ? { stroke: o.stroke || INK, 'stroke-width': o.sw, 'paint-order': 'stroke', 'stroke-linejoin': 'round' } : {}) }, g);
  m.textContent = str;
  return { g, t: m, w: m.getComputedTextLength() };
}
function card(parent, x, y, w, h, fill, r = 26, sh = 12, sw = 7) {
  el('rect', { x: x + sh, y: y + sh, width: w, height: h, rx: r, fill: INK }, parent);
  return el('rect', { x, y, width: w, height: h, rx: r, fill, stroke: INK, 'stroke-width': sw }, parent);
}
function chip(parent, str, fill = INK, color = CREAM, size = 44) {
  const g = el('g', {}, parent), inner = el('g', {}, g);
  const t = txt(inner, str, { size, fill: color });
  t.t.setAttribute('y', size * .36); if (t.g.firstChild !== t.t) t.g.firstChild.setAttribute('y', size * .36 + 0);
  const w = t.w + size * 1.4, h = size * 1.8;
  inner.insertBefore(el('rect', { x: -w / 2 + 8, y: -h / 2 + 8, width: w, height: h, rx: h / 2, fill: INK }), t.g);
  inner.insertBefore(el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill, stroke: INK, 'stroke-width': 6 }), t.g);
  return { g, inner, w, update(x, y, k, r = 0) { show(g, k > .001); tf(g, x, y, 1, r); tf(inner, 0, 0, k); } };
}
function emoji(parent, ch, size) { const t = el('text', { class: 'emoji', 'font-size': size, 'text-anchor': 'middle', y: size * .35 }, parent); t.textContent = ch; return t; }
function starPath(r1, r2, n = 5) { let d = ''; for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = Math.PI * i / n - Math.PI / 2; d += (i ? 'L' : 'M') + fmt(Math.cos(a) * r) + ',' + fmt(Math.sin(a) * r); } return d + 'Z'; }
function coin(parent, label, r = 100, size) {
  const g = el('g', {}, parent);
  el('circle', { cx: 10, cy: 10, r, fill: INK }, g);
  el('circle', { r, fill: GREEN, stroke: INK, 'stroke-width': 8 }, g);
  el('circle', { r: r * .78, fill: 'none', stroke: '#1E9E57', 'stroke-width': 8 }, g);
  el('path', { d: `M${-r * .55},${-r * .35} A${r * .7},${r * .7} 0 0 1 ${r * .2},${-r * .65}`, stroke: '#7EEBAA', 'stroke-width': 10, fill: 'none', 'stroke-linecap': 'round' }, g);
  const t = el('text', { 'text-anchor': 'middle', 'font-size': size || r * .9, y: (size || r * .9) * .36, fill: CREAM, stroke: INK, 'stroke-width': 6, 'paint-order': 'stroke' }, g); t.textContent = label;
  if (label === '¥') t.setAttribute('style', "font-family: 'DejaVu Sans'; font-weight: 700");
  return g;
}
function sparkles(parent, n, seed, rad = 160) {
  const R = rng(seed), s = [];
  for (let i = 0; i < n; i++) s.push({ e: el('path', { d: starPath(22, 7, 4), fill: CREAM, stroke: INK, 'stroke-width': 4 }, parent), a: R() * 6.28, r: rad * (.8 + R() * .5), ph: R() * 6 });
  return { update(x, y, k, t) { s.forEach(o => { const kk = k * (.5 + .5 * Math.abs(Math.sin(t * 4 + o.ph))); tf(o.e, x + Math.cos(o.a) * o.r * (.6 + .4 * k), y + Math.sin(o.a) * o.r * (.6 + .4 * k), kk, t * 60); }); } };
}
function burst(parent, n = 14, col = INK) {
  const g = el('g', {}, parent);
  const ls = []; for (let i = 0; i < n; i++) ls.push(el('line', { stroke: col, 'stroke-width': 10, 'stroke-linecap': 'round', transform: `rotate(${i * 360 / n})` }, g));
  return { update(x, y, u) { show(g, u > 0 && u < 1); g.setAttribute('transform', `translate(${fmt(x)},${fmt(y)})`); const r0 = 120 + 220 * E.out(u), r1 = r0 + 70 * (1 - u); ls.forEach(l => set(l, { x1: 0, y1: -r0, x2: 0, y2: -r1, opacity: fmt(1 - u) })); } };
}
function bubble(parent, str, fill = RED, color = CREAM, size = 54) {
  const g = el('g', {}, parent), inner = el('g', {}, g);
  const probe = txt(inner, str, { size, fill: color });
  const w = probe.w + 80, h = size * 2;
  const d = `M${-w / 2},${-h / 2} h${w} a26,26 0 0 1 0,0 v${h} h${-w * .55} l-46,52 l6,-52 h${-w * .45 - 6} Z`;
  inner.insertBefore(el('path', { d: `M${-w / 2 + 10},${-h / 2 + 10} h${w} v${h} h${-w * .55} l-46,52 l6,-52 h${-w * .45 - 6} Z`, fill: INK, 'stroke-linejoin': 'round' }), probe.g);
  inner.insertBefore(el('path', { d: `M${-w / 2},${-h / 2} h${w} v${h} h${-w * .55} l-46,52 l6,-52 h${-w * .45 - 6} Z`, fill, stroke: INK, 'stroke-width': 7, 'stroke-linejoin': 'round' }), probe.g);
  probe.t.setAttribute('y', size * .36);
  return { g, update(x, y, k, r = 0) { show(g, k > .001); tf(g, x, y, 1, r); tf(inner, 0, 0, k); } };
}

// --- personnages flat --------------------------------------------------------
function makeChar(parent, o) {
  const c = Object.assign({ skin: '#F2C09A', shirt: WHITE, pants: INK, hair: INK, hairStyle: 'short', jacket: null, tie: null, bow: false, apron: false, mustache: false }, o);
  const g = el('g', {}, parent), inner = el('g', {}, g);
  const limb = (par, col, len, w) => { el('line', { x1: 0, y1: 0, x2: 0, y2: len, stroke: INK, 'stroke-width': w + 12, 'stroke-linecap': 'round' }, par); el('line', { x1: 0, y1: 0, x2: 0, y2: len, stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, par); };
  [-1, 1].forEach(s => { const lg = el('g', { transform: `translate(${s * 30},-160)` }, inner); limb(lg, c.pants, 140, 38); el('ellipse', { cx: s * 8, cy: 150, rx: 32, ry: 15, fill: INK }, lg); });
  const armL = el('g', {}, inner), armR = el('g', {}, inner);
  [armL, armR].forEach(a => { limb(a, c.jacket || c.shirt, 135, 32); el('circle', { cy: 148, r: 19, fill: c.skin, stroke: INK, 'stroke-width': 6 }, a); });
  el('path', { d: 'M-88,-328 Q0,-346 88,-328 L76,-150 Q0,-136 -76,-150Z', fill: c.jacket || c.shirt, stroke: INK, 'stroke-width': 7, 'stroke-linejoin': 'round' }, inner);
  if (c.jacket) el('path', { d: 'M-34,-334 L0,-250 L34,-334Z', fill: c.shirt, stroke: INK, 'stroke-width': 6, 'stroke-linejoin': 'round' }, inner);
  if (c.apron) el('path', { d: 'M-70,-240 L70,-240 L74,-120 L-74,-120Z', fill: INK }, inner);
  if (c.tie) el('path', { d: 'M0,-322 L-14,-300 L0,-210 L14,-300Z', fill: c.tie, stroke: INK, 'stroke-width': 5, 'stroke-linejoin': 'round' }, inner);
  if (c.bow) el('path', { d: 'M0,-322 L-30,-336 L-30,-306Z M0,-322 L30,-336 L30,-306Z', fill: INK, stroke: INK, 'stroke-width': 6, 'stroke-linejoin': 'round' }, inner);
  const head = el('g', {}, inner);
  el('rect', { x: -16, y: 44, width: 32, height: 30, fill: c.skin, stroke: INK, 'stroke-width': 6 }, head);
  el('circle', { r: 66, fill: c.skin, stroke: INK, 'stroke-width': 7 }, head);
  if (c.hairStyle === 'short') el('path', { d: 'M-66,-6 C-72,-80 72,-84 66,-10 C50,-40 10,-46 -10,-38 C-30,-46 -54,-34 -66,-6Z', fill: c.hair, stroke: INK, 'stroke-width': 6, 'stroke-linejoin': 'round' }, head);
  if (c.hairStyle === 'bald') el('path', { d: 'M-66,0 C-66,-30 -56,-40 -46,-44 L-50,4Z M66,0 C66,-30 56,-40 46,-44 L50,4Z', fill: c.hair, stroke: INK, 'stroke-width': 5 }, head);
  if (c.hairStyle === 'cap') { el('path', { d: 'M-68,-10 C-68,-82 68,-82 68,-10Z', fill: c.hair, stroke: INK, 'stroke-width': 6 }, head); el('path', { d: 'M20,-14 L104,-10 Q104,4 60,4 L18,4Z', fill: c.hair, stroke: INK, 'stroke-width': 6, 'stroke-linejoin': 'round' }, head); }
  const face = el('g', {}, head);
  const eyes = [-1, 1].map(s => el('ellipse', { cx: s * 24, cy: -4, rx: 8, ry: 10, fill: INK }, face));
  const brows = [-1, 1].map(s => el('path', { d: 'M-14,0 L14,0', stroke: INK, 'stroke-width': 7, 'stroke-linecap': 'round' }, face));
  if (c.mustache) el('path', { d: 'M-36,26 Q-18,12 0,22 Q18,12 36,26 Q20,36 0,30 Q-20,36 -36,26Z', fill: INK }, face);
  const mouth = el('path', { stroke: INK, 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' }, face);
  [-1, 1].forEach(s => el('ellipse', { cx: s * 42, cy: 22, rx: 11, ry: 7, fill: RED, opacity: .35 }, face));
  const sweat = el('path', { d: 'M0,-26 C14,-6 16,6 0,14 C-16,6 -14,-6 0,-26Z', fill: '#8FD3FF', stroke: INK, 'stroke-width': 5 }, head);
  return {
    g,
    update(q) {
      const t = q.t || 0, bob = q.bob ?? Math.sin(t * 3) * 3;
      tf(g, q.x, q.y + bob, q.s ?? 1);
      inner.setAttribute('transform', q.flip ? 'scale(-1,1)' : '');
      armL.setAttribute('transform', `translate(-86,-312) rotate(${fmt(q.armL ?? 8)})`);
      armR.setAttribute('transform', `translate(86,-312) rotate(${fmt(-(q.armR ?? 8))})`);
      head.setAttribute('transform', `translate(${fmt(q.headX || 0)},-410) rotate(${fmt(q.headTilt || 0)})`);
      const lk = q.look || [0, 0];
      eyes.forEach((e, i) => { const cx = (i ? 1 : -1) * 24; e.setAttribute('transform', `translate(${fmt(lk[0] + cx)},${fmt(lk[1] - 4)}) scale(1,${fmt(1 - blink(t, q.blinkOff || 0) * .9)}) translate(${-cx},4)`); });
      const m = q.mood ?? .6, worry = q.worry || 0;
      brows.forEach((b, i) => { const s = i ? 1 : -1; b.setAttribute('transform', `translate(${s * 24 + lk[0]},${fmt(-30 - worry * 6)}) rotate(${fmt(-s * 18 * worry + s * 10 * (q.angry || 0))})`); });
      mouth.setAttribute('d', `M-20,${fmt(34 - m * 4)} Q0,${fmt(34 + m * 16)} 20,${fmt(34 - m * 4)}`);
      const sw = q.sweat || 0, ph = (t * 1.3) % 1;
      set(sweat, { transform: `translate(58,${fmt(-34 + ph * 30)}) scale(${fmt(sw)})`, opacity: fmt(sw * (1 - ph * .6)) });
    }
  };
}

// --- drapeaux qui flottent (tranches verticales) -----------------------------
function flagSymbol(id, draw) { const s = el('g', { id }, defs); draw(s); return id; }
flagSymbol('flagUS', g => {
  for (let i = 0; i < 7; i++) el('rect', { x: 0, y: i * 500 / 7, width: 780, height: 500 / 7 + .5, fill: i % 2 ? WHITE : RED }, g);
  el('rect', { width: 330, height: 500 * 4 / 7, fill: INK }, g);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) el('path', { d: starPath(22, 9), fill: CREAM, transform: `translate(${50 + c * 77},${55 + r * 85})` }, g);
});
flagSymbol('flagJP', g => { el('rect', { width: 780, height: 500, fill: WHITE }, g); el('circle', { cx: 390, cy: 250, r: 150, fill: RED }, g); });
function makeFlag(parent, id, w = 780, h = 500) {
  const g = el('g', {}, parent);
  el('rect', { x: 16, y: 16, width: w, height: h, rx: 18, fill: INK }, g);
  const slices = [], N = 18;
  for (let i = 0; i < N; i++) {
    const cid = `${id}c${uid++}`; const cp = el('clipPath', { id: cid }, defs);
    el('rect', { x: i * w / N - .6, y: -40, width: w / N + 1.2, height: h + 80 }, cp);
    const wrap = el('g', {}, g);
    const inner = el('g', { 'clip-path': `url(#${cid})` }, wrap);
    el('use', { href: `#${id}` }, inner);
    slices.push(wrap);
  }
  el('rect', { width: w, height: h, rx: 18, fill: 'none', stroke: INK, 'stroke-width': 9 }, g);
  return { g, update(t, amp = 10) { slices.forEach((s, i) => s.setAttribute('transform', `translate(0,${fmt(Math.sin(t * 5 - i * .45) * amp * (i / slices.length))})`)); } };
}
let uid = 0;

// ---------------------------------------------------------------------------
// Scènes
// ---------------------------------------------------------------------------
const sceneLayer = el('g', {}, svg);
const scenes = [];
let shake = 0;
function S(a, b, build, dir = 1) {
  const root = el('g', {}, sceneLayer), cam = el('g', {}, root);
  const upd = build(cam, a, b);
  scenes.push({ a, b, root, cam, upd, dir });
}

// Temps clés (dérivés des mots de la voix)
const T = {
  s2: 9.62, s3: 16.36, s4: 22.75, s5: 34.3, s6: 40.03, s7: 46.42,
};

// ====== 1. ACCROCHE ==========================================================
S(0, T.s2, (cam) => {
  const t20 = Wt('20 %'), tIns = Wt('insulte.'), tJap = Wt('Au') - .12, tUn = Wt('un', 1, tJap), tVex = Wt('vexer.'), tAlors = Wt('Alors ?'), tQui = Wt('Qui');
  el('rect', { width: W, height: H, fill: CREAM }, cam);
  const dots = el('g', { opacity: .08 }, cam);
  for (let y = 160; y < 1700; y += 60) for (let x = 40; x < 1000; x += 60) el('circle', { cx: x + (y / 60 % 2) * 30, cy: y, r: 5, fill: INK }, dots);
  const us = el('g', {}, cam);
  const fUS = makeFlag(us, 'flagUS');
  const big = el('g', {}, us);
  txt(big, '20 %', { size: 300, fill: GREEN, sw: 18, shadow: 16, ls: -6 });
  const stamp = el('g', {}, us);
  el('rect', { x: -230, y: -62, width: 460, height: 124, rx: 16, fill: 'none', stroke: RED, 'stroke-width': 12 }, stamp);
  txt(stamp, 'INSULTE !', { size: 76, fill: RED }).t.setAttribute('y', 27);
  const bst = burst(us, 16, INK);
  const jp = el('g', {}, cam);
  const fJP = makeFlag(jp, 'flagJP');
  const yen = coin(jp, '¥', 95, 110);
  const vexe = el('g', {}, jp); emoji(vexe, '😤', 230);
  const puffs = [0, 1].map(() => el('ellipse', { rx: 40, ry: 24, fill: WHITE, stroke: INK, 'stroke-width': 5 }, jp));
  const vs = el('g', {}, cam);
  el('circle', { r: 70, fill: INK }, vs); txt(vs, 'VS', { size: 64, fill: CREAM }).t.setAttribute('y', 23);
  const q = el('g', {}, cam);
  const q1 = txt(q, 'QUI A', { size: 170, fill: INK, shadow: 12, sw: 0 }); q1.g.setAttribute('transform', 'translate(0,-90)');
  const q2 = el('g', { transform: 'translate(0,100)' }, q);
  const qa = txt(q2, 'RAISON', { size: 170, fill: GREEN, sw: 14, shadow: 14 });
  const qm = txt(q2, '?', { size: 230, fill: RED, sw: 14, shadow: 14 }); qm.g.setAttribute('transform', `translate(${fmt(qa.w / 2 + 70)},10)`); qa.g.setAttribute('transform', 'translate(-50,0)');
  return t => {
    // drapeau US
    const inUS = E.back(clamp(t / .55));
    const outUS = p(t, tJap - .05, tJap + .25, E.in);
    const mini = p(t, tAlors - .1, tAlors + .3, E.out5);
    const usX = lerp(lerp(CX, CX + 0, 0) + outUS * -1100, 270, mini), usY = lerp(lerp(-700, 560, inUS), 330, mini), usS = lerp(1, .33, mini);
    show(us, outUS < 1 || mini > 0);
    tf(us, mini > 0 ? 270 : CX - 1100 * outUS, mini > 0 ? lerp(330, 330, 1) : lerp(-700, 560, inUS), mini > 0 ? .33 * mini + .001 : 1, mini > 0 ? 0 : (1 - inUS) * -8);
    fUS.g.setAttribute('transform', 'translate(-390,-250)'); fUS.update(t);

{
